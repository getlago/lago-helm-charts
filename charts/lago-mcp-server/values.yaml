# Default values for lago-mcp-server.

config:
  mistral:
    # -- Mistral AI agent ID
    agentID:
    # -- Mistral AI API key
    apiKey:

  # -- Log level (`debug`, `info`, `warn`, `error`)
  logLevel:

  api:
    # -- Lago API URL for the MCP server to connect to
    url:

# -- Name of an existing Secret containing MCP server credentials
existingSecret:

image:
  # -- Container image repository
  repository: ghcr.io/getlago/mcp-server
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Override the image tag (defaults to Chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
# @default -- `[]`
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

container:
  # -- Override the container name (defaults to chart fullname)
  name: ""
  # -- Container entrypoint command
  command: ["./lago-mcp-server"]
  # -- Container command arguments
  args: ["sse", "--host", "0.0.0.0"]
  ports:
    # -- HTTP container port
    http: 3000

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Automount the ServiceAccount API credentials
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- ServiceAccount name (generated from fullname if not set)
  name: ""

service:
  # -- Service type (`ClusterIP`, `NodePort`, `LoadBalancer`)
  type: ClusterIP
  # -- Service port
  port: 80

autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 100
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80

# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}

# -- Container-level security context
securityContext: {}

# -- Extra environment variables (map format, deep-mergeable)
extraEnv: {}

# -- Extra envFrom sources
# @default -- `[]` (See [values.yaml])
extraEnvFrom: []

# -- Resource requests and limits
resources: {}

# -- Additional volumes
volumes: []

# -- Additional volume mounts
volumeMounts: []

# -- Node selector constraints
nodeSelector: {}

# -- Pod tolerations
tolerations: []

# -- Pod affinity rules
affinity: {}
