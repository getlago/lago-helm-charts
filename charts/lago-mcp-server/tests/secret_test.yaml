suite: Test lago-mcp-server secret
templates:
  - templates/secret.yaml
values:
  - fixtures/required.yaml

tests:
  - it: should store the agent ID and the API key under their own keys
    asserts:
      - equal:
          path: data["mistral.agentID"]
          value: dGVzdC1hZ2VudC1pZA== # test-agent-id
      - equal:
          path: data["mistral.apiKey"]
          value: dGVzdC1hcGkta2V5 # test-api-key

  - it: should fail when the API key is missing
    set:
      config.mistral.apiKey: null
    asserts:
      - failedTemplate:
          errorMessage: config.mistral.apiKey must be provided

  - it: should not render when existingSecret is set
    set:
      existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0
