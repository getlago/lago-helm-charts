suite: Test lago-config.secretName helper
templates:
  - templates/secret.yaml

tests:
  - it: should use default secret name when no custom name is set
    set:
      secret.create: true
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    release:
      name: my-release
    chart:
      name: lago-config
    asserts:
      - equal:
          path: metadata.name
          value: my-release-lago-config

  - it: should use secret.name when provided
    set:
      secret.create: true
      secret.name: "custom-secret"
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret

  - it: should use config.secret.name when provided (deprecated path)
    set:
      secret.create: true
      config.secret.name: "config-secret"
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    asserts:
      - equal:
          path: metadata.name
          value: config-secret

  - it: should use global.config.secret when provided
    set:
      secret.create: true
      global.config.secret: "global-secret"
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    asserts:
      - equal:
          path: metadata.name
          value: global-secret

  - it: should prioritize secret.name over config.secret.name
    set:
      secret.create: true
      secret.name: "direct-secret"
      config.secret.name: "config-secret"
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    asserts:
      - equal:
          path: metadata.name
          value: direct-secret

  - it: should prioritize secret.name over global.config.secret
    set:
      secret.create: true
      secret.name: "direct-secret"
      global.config.secret: "global-secret"
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    asserts:
      - equal:
          path: metadata.name
          value: direct-secret

  - it: should prioritize config.secret.name over global.config.secret
    set:
      secret.create: true
      config.secret.name: "config-secret"
      global.config.secret: "global-secret"
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    asserts:
      - equal:
          path: metadata.name
          value: config-secret

  - it: should not create secret when secret.create is false
    set:
      secret.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should emit a per-component sentry DSN key for each non-empty entry
    set:
      secret.create: true
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
      global.sentry.dsn.back: "https://back@sentry.example/1"
      global.sentry.dsn.events: "https://events@sentry.example/3"
      global.sentry.dsn.front: "https://front@sentry.example/2"
    asserts:
      - equal:
          path: data["sentry.dsn.back"]
          value: "aHR0cHM6Ly9iYWNrQHNlbnRyeS5leGFtcGxlLzE="
      - equal:
          path: data["sentry.dsn.events"]
          value: "aHR0cHM6Ly9ldmVudHNAc2VudHJ5LmV4YW1wbGUvMw=="
      - equal:
          path: data["sentry.dsn.front"]
          value: "aHR0cHM6Ly9mcm9udEBzZW50cnkuZXhhbXBsZS8y"

  - it: should omit sentry DSN keys when all entries are empty
    set:
      secret.create: true
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
    asserts:
      - notExists:
          path: data["sentry.dsn.back"]
      - notExists:
          path: data["sentry.dsn.events"]
      - notExists:
          path: data["sentry.dsn.front"]

  - it: should emit only the populated sentry DSN entries
    set:
      secret.create: true
      global.database.uri: "postgresql://localhost"
      global.encryption.key: "test-key"
      global.encryption.salt: "test-salt"
      global.signing.hmac: "test-hmac"
      global.signing.rsa: "test-rsa"
      global.sentry.dsn.back: "https://back@sentry.example/1"
      global.sentry.dsn.events: ""
      global.sentry.dsn.front: ""
    asserts:
      - equal:
          path: data["sentry.dsn.back"]
          value: "aHR0cHM6Ly9iYWNrQHNlbnRyeS5leGFtcGxlLzE="
      - notExists:
          path: data["sentry.dsn.events"]
      - notExists:
          path: data["sentry.dsn.front"]
