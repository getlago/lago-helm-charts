suite: Test lago-config.streaming.secretName helper
templates:
  - templates/streaming-secret.yaml

tests:
  - it: should use default streaming secret name when no custom name is set
    set:
      global.streaming_ingestion.enabled: true
      secretStreaming.create: true
    release:
      name: my-release
    chart:
      name: lago-config
    asserts:
      - equal:
          path: metadata.name
          value: my-release-lago-config-streaming

  - it: should use secretStreaming.name when provided
    set:
      global.streaming_ingestion.enabled: true
      secretStreaming.create: true
      secretStreaming.name: "custom-streaming-secret"
    asserts:
      - equal:
          path: metadata.name
          value: custom-streaming-secret

  - it: should use config.secretStreaming.name when provided
    set:
      global.streaming_ingestion.enabled: true
      secretStreaming.create: true
      config.secretStreaming.name: "config-streaming-secret"
    asserts:
      - equal:
          path: metadata.name
          value: config-streaming-secret

  - it: should use global.streaming_ingestion.secret when provided
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.secret: "global-streaming-secret"
      secretStreaming.create: true
    asserts:
      - equal:
          path: metadata.name
          value: global-streaming-secret

  - it: should prioritize secretStreaming.name over config.secretStreaming.name
    set:
      global.streaming_ingestion.enabled: true
      secretStreaming.create: true
      secretStreaming.name: "direct-streaming-secret"
      config.secretStreaming.name: "config-streaming-secret"
    asserts:
      - equal:
          path: metadata.name
          value: direct-streaming-secret

  - it: should prioritize secretStreaming.name over global.streaming_ingestion.secret
    set:
      global.streaming_ingestion.enabled: true
      secretStreaming.create: true
      secretStreaming.name: "direct-streaming-secret"
      global.streaming_ingestion.secret: "global-streaming-secret"
    asserts:
      - equal:
          path: metadata.name
          value: direct-streaming-secret

  - it: should prioritize config.secretStreaming.name over global.streaming_ingestion.secret
    set:
      global.streaming_ingestion.enabled: true
      secretStreaming.create: true
      config.secretStreaming.name: "config-streaming-secret"
      global.streaming_ingestion.secret: "global-streaming-secret"
    asserts:
      - equal:
          path: metadata.name
          value: config-streaming-secret

  - it: should not create streaming secret when streaming_ingestion is disabled
    set:
      global.streaming_ingestion.enabled: false
      secretStreaming.create: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create streaming secret when secretStreaming.create is false
    set:
      global.streaming_ingestion.enabled: true
      secretStreaming.create: false
    asserts:
      - hasDocuments:
          count: 0
