suite: Test lago-config.fullname helper
templates:
  - templates/configmap.yaml

tests:
  - it: should use release name when it contains chart name
    set:
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    release:
      name: lago-config
    chart:
      name: lago-config
    asserts:
      - equal:
          path: metadata.name
          value: lago-config

  - it: should combine release and chart name when release does not contain chart name
    set:
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    release:
      name: production
    chart:
      name: lago-config
    asserts:
      - equal:
          path: metadata.name
          value: production-lago-config

  - it: should truncate long names to 63 characters and remove trailing dashes
    set:
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    release:
      name: very-long-release-name-that-will-be-combined-with
    chart:
      name: lago-config
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^.{1,63}$
      - notMatchRegex:
          path: metadata.name
          pattern: "-$"
      - equal:
          path: metadata.name
          value: very-long-release-name-that-will-be-combined-with-lago-config

  - it: should use release name for fullname when release contains chart name (e.g. my-lago-config)
    set:
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    release:
      name: my-lago-config
    chart:
      name: lago-config
    asserts:
      - equal:
          path: metadata.name
          value: my-lago-config
