suite: Test lago-config streaming Secret data keys
templates:
  - templates/streaming-secret.yaml

# Baseline required for the Secret to render at all — streaming ingestion
# enabled + Secret creation enabled. Individual tests layer their specific
# password/username values on top.
set:
  global.streaming_ingestion.enabled: true
  secretStreaming.create: true

tests:
  # ============================================================================
  # LAGO_CLICKHOUSE_USERNAME_READ_ONLY (optional, only rendered when set)
  # ============================================================================
  - it: does not render LAGO_CLICKHOUSE_USERNAME_READ_ONLY when usernameReadOnly is unset
    asserts:
      - notExists:
          path: data.LAGO_CLICKHOUSE_USERNAME_READ_ONLY

  - it: renders LAGO_CLICKHOUSE_USERNAME_READ_ONLY when usernameReadOnly is set
    set:
      global.streaming_ingestion.clickhouse.usernameReadOnly: readonly_user
    asserts:
      - equal:
          # Secret data values are base64-encoded by Kubernetes;
          # helm-unittest returns the raw template output, which for
          # this template pipes the value through untouched.
          path: data.LAGO_CLICKHOUSE_USERNAME_READ_ONLY
          value: readonly_user

  # ============================================================================
  # LAGO_CLICKHOUSE_PASSWORD_READ_ONLY (optional, only rendered when set)
  # ============================================================================
  - it: does not render LAGO_CLICKHOUSE_PASSWORD_READ_ONLY when passwordReadOnly is unset
    asserts:
      - notExists:
          path: data.LAGO_CLICKHOUSE_PASSWORD_READ_ONLY

  - it: renders LAGO_CLICKHOUSE_PASSWORD_READ_ONLY when passwordReadOnly is set
    set:
      global.streaming_ingestion.clickhouse.passwordReadOnly: readonly_pw
    asserts:
      - equal:
          path: data.LAGO_CLICKHOUSE_PASSWORD_READ_ONLY
          value: readonly_pw
      # Primary password is independent — set both to verify no clash
  - it: renders both primary and read-only credentials independently
    set:
      global.streaming_ingestion.clickhouse.username: primary_user
      global.streaming_ingestion.clickhouse.password: primary_pw
      global.streaming_ingestion.clickhouse.usernameReadOnly: readonly_user
      global.streaming_ingestion.clickhouse.passwordReadOnly: readonly_pw
    asserts:
      - equal:
          path: data.LAGO_CLICKHOUSE_USERNAME
          value: primary_user
      - equal:
          path: data.LAGO_CLICKHOUSE_PASSWORD
          value: primary_pw
      - equal:
          path: data.LAGO_CLICKHOUSE_USERNAME_READ_ONLY
          value: readonly_user
      - equal:
          path: data.LAGO_CLICKHOUSE_PASSWORD_READ_ONLY
          value: readonly_pw
