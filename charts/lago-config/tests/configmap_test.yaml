suite: Test lago-config.configMapName helper
templates:
  - templates/configmap.yaml

tests:
  - it: should use default configmap name when no custom name is set
    set:
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    release:
      name: my-release
    chart:
      name: lago-config
    asserts:
      - equal:
          path: metadata.name
          value: my-release-lago-config

  - it: should use configmap.name when provided
    set:
      configmap.name: "custom-configmap"
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    asserts:
      - equal:
          path: metadata.name
          value: custom-configmap

  - it: should use config.configmap.name when provided
    set:
      config.configmap.name: "config-configmap"
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    asserts:
      - equal:
          path: metadata.name
          value: config-configmap

  - it: should use global.config.configmap when provided
    set:
      global.config.configmap: "global-configmap"
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    asserts:
      - equal:
          path: metadata.name
          value: global-configmap

  - it: should prioritize configmap.name over config.configmap.name
    set:
      configmap.name: "direct-configmap"
      config.configmap.name: "config-configmap"
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    asserts:
      - equal:
          path: metadata.name
          value: direct-configmap

  - it: should prioritize configmap.name over global.config.configmap
    set:
      configmap.name: "direct-configmap"
      global.config.configmap: "global-configmap"
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    asserts:
      - equal:
          path: metadata.name
          value: direct-configmap

  - it: should prioritize config.configmap.name over global.config.configmap
    set:
      config.configmap.name: "config-configmap"
      global.config.configmap: "global-configmap"
      global.urls.api: "http://api.test"
      global.urls.front: "http://front.test"
      global.redis.uri: "redis://localhost"
      global.redisCache.uri: "redis://localhost"
      global.redisStore.uri: "redis://localhost"
    asserts:
      - equal:
          path: metadata.name
          value: config-configmap
