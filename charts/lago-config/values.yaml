# Default values for lago-config.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# All config values are under global so they can be shared across subcharts
global:
  lago:
    version: ""
    env: "production"
    license: ""
    signup: false
    cloud: false
    sidekiqPro: false
    pdfGeneration: false

  config:
    configmap:
    secret:

  urls:
    api: ""
    front: ""
    pdf: ""

  database:
    uri: ""
    pool: 20

  encryption:
    key: "" # ENCRYPTION_PRIMARY_KEY
    salt: "" # ENCRYPTION_KEY_DERIVATION_SALT

  signing:
    hmac: "" # SECRET_KEY_BASE used by webhooks, message verifier HS256
    rsa: ""  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

  redis:
    uri: ""
    password: ""

  redisCache:
    uri: ""
    password: ""

  redisStore:
    uri: ""
    password: ""

  sentryDsn: ""
  segmentWriteKey: ""

  nango:
    secretKey: ""
    publicKey: ""

  s3:
    enabled: false
    accessKeyId: ""
    secretAccessKey: ""
    bucket: ""
    region: ""
    endpoint: ""
    # s3.pathStyle -- (boolean)
    pathStyle:

  smtp:
    enabled: false
    username: ""
    password: ""
    from: ""
    port: 25
    address: ""

  google:
    enabled: false
    clientId:
    clientSecret:

  gocardless:
    enabled: false
    clientId:
    clientSecret:
    proxy:

  mcp:
    enabled: false
    clientId:
    clientSecret:
    endpoint:

  data:
    enabled: false
    token:
    endpoint:

  streaming_ingestion:
    enabled: false
    configmap: ""
    secret: ""

    clickhouse:
      # username and password are not required here if using an external secret:
      #  config.enabled: false, config.secret.name: "..."
      username: ""
      password: ""
      port: 9000
      address: clickhouse
      tls: false
      database: default

    # kafka is required if clickhouse is set
    kafka:
      # username and password are not required here if if using an external secret:
      #  config.enabled: false, config.secret.name: "..."
      username: ""
      password: ""
      tls: false
      # SCRAM-SHA-512, SCRAM-SHA-256
      saslMechanisms:
      consumerGroup: events_consumer
      # you must provide a list of Kafka servers if clickhouse is enabled
      bootstrapServers: []
      #   - "kafka-server:9092"
      topics:
        eventsChargedInAdvance: events_charged_in_advance
        eventsDeadLetter: events_dead_letter
        eventsEnriched: events_enriched
        eventsEnrichedExpanded: events_enriched_expanded
        eventsRaw: events_raw
        activityLogs: activity_logs
        apiLogs: api_logs

configmap:
  # The name of the config map to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

  # -- Labels to be added to lago-config configmap
  labels: {}
  # -- Annotations to be added to lago-config configmap
  annotations: {}

secret:
  # -- Create the lago-config secret for [sensitive config]
  create: true

  # The name of the secret to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

  # -- Labels to be added to lago-config secret
  labels: {}
  # -- Annotations to be added to lago-config secret
  annotations: {}

configmapStreaming:
  name: ""

  labels: {}

  annotations: {}

secretStreaming:
  # -- Create the lago-config secret for [sensitive config]
  create: true

  # The name of the secret to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

  # -- Labels to be added to lago-config secret
  labels: {}
  # -- Annotations to be added to lago-config secret
  annotations: {}
