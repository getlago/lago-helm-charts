# Default values for lago-config.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

database:
  url: ""

encryption:
  key: "" # ENCRYPTION_PRIMARY_KEY
  salt: "" # ENCRYPTION_KEY_DERIVATION_SALT

signing:
  hmac: # SECRET_KEY_BASE used by webhooks, message verifier HS256
  rsa:  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

redis:
  url: ""
  password: ""

redisCache:
  url: ""
  password: ""

redisStore:
  url: ""
  password: ""

lago:
  license: ""

s3:
  enabled: false
  # accessKeyId and secretAccessKey are not required here if using existingSecret
  # accessKeyId: "<your-aws-access-key>"
  accessKeyId: ""
  # secretAccessKey: "<your-aws-secret-key>"
  secretAccessKey: ""
  # bucket: "<your-aws-bucket>"
  bucket: ""
  # region: "<your-aws-region>"
  region: ""
  # endpoint: "https://s3.<region>.amazonaws.com" # Leave empty for default AWS S3 endpoint
  endpoint: ""


configMap:
  # -- Create the lago-config configmap for [declarative setup]
  create: true

  # The name of the config map to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

  # -- Labels to be added to lago-config configmap
  labels: {}
  # -- Annotations to be added to lago-config configmap
  annotations: {}

secret:
  # -- Create the lago-config secret for [sensitive config]
  create: false

  # The name of the secret to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

  # -- Labels to be added to lago-config secret
  labels: {}
  # -- Annotations to be added to lago-config secret
  annotations: {}
