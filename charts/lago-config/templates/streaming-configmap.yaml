{{- if .Values.global.streaming_ingestion.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lago-config.streaming.configMapName" . }}
  labels:
    {{- include "lago-config.labels" . | nindent 4 }}
    {{- with .Values.configmapStreaming.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configmapStreaming.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  {{- include "lago-config.streaming.configMapData" . | trim | nindent 2 }}
{{- end }}
