{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lago-config.configMapName" . }}
  labels:
    {{- include "lago-config.labels" . | nindent 4 }}
    {{- with .Values.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  {{- with .Values.redis.url }}
  redis.url: {{.}}
  {{- end }}
  {{- with .Values.redisCache.url }}
  redisCache.url: {{.}}
  {{- end }}
  {{- with .Values.redisStore.url }}
  redisStore.url: {{.}}
  {{- end }}
{{- end }}
