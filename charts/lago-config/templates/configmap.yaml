{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lago-config.configMapName" . }}
  labels:
    {{- include "lago-config.labels" . | nindent 4 }}
    {{- with .Values.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  {{- with .Values.global.redis.url }}
  redis.url: {{ . }}
  {{- end }}
  {{- with .Values.global.redisCache.url }}
  redisCache.url: {{ . }}
  {{- end }}
  {{- with .Values.global.redisStore.url }}
  redisStore.url: {{ . }}
  {{- end }}
  {{- if .Values.global.s3.enabled }}
  s3.bucket: {{ .Values.global.s3.bucket }}
  s3.region: {{ .Values.global.s3.region }}
  {{- with .Values.global.s3.endpoint }}
  s3.endpoint: {{ . }}
  {{- end }}
  {{- end }}
{{- end }}
