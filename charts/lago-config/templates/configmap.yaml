{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lago-config.configMapName" . }}
  labels:
    {{- include "lago-config.labels" . | nindent 4 }}
    {{- with .Values.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  {{- with .Values.global.redis.uri }}
  redis.uri: {{ . }}
  {{- end }}
  {{- with .Values.global.redisCache.uri }}
  redisCache.uri: {{ . }}
  {{- end }}
  {{- with .Values.global.redisStore.uri }}
  redisStore.uri: {{ . }}
  {{- end }}
  {{- if .Values.global.s3.enabled }}
  s3.bucket: {{ .Values.global.s3.bucket }}
  s3.region: {{ .Values.global.s3.region }}
  {{- with .Values.global.s3.endpoint }}
  s3.endpoint: {{ . }}
  {{- end }}
  {{- end }}
  {{- if .Values.global.smtp.enabled }}
  smtp.port: {{ .Values.global.smtp.port | quote }}
  smtp.address: {{ .Values.global.smtp.address }}
  smtp.from: {{ .Values.global.smtp.from }}
  {{- end }}
  {{- if .Values.global.gocardless.enabled }}
  gocardless.proxy: {{ .Values.global.gocardless.proxy }}
  {{- end }}
{{- end }}
