# Default values for lago-front.

# -- Config section used for merging with lago-config helpers
config: {}

global:
  lago:
    # -- Rails environment (`production`, `staging`, `development`)
    env: production
    # -- Enable self-service signup
    signup: false
    # -- Enable PDF generation support
    pdfGeneration: false

  urls:
    # -- Public URL of the Lago API
    api: ""
    # -- Internal URL of the PDF service (Gotenberg)
    pdf: ""

  nango:
    # -- Nango public key for frontend OAuth flows
    publicKey: ""

  # -- Sentry DSN for error tracking
  sentryDsn: ""

  gocardless:
    # -- Enable GoCardless integration
    enabled: false
    # -- GoCardless API proxy URL
    proxy: ""

container:
  # -- Override the container name (defaults to chart fullname)
  name: ""
  # -- Container entrypoint command
  command:
  # -- Container command arguments
  args:
  ports:
    # -- HTTP container port
    http: 80

# -- Number of replicas (ignored when autoscaling is enabled)
replicaCount: 1

image:
  # -- Container image repository
  repository: getlago/front
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Override the image tag (defaults to Chart appVersion)
  tag:

# -- Image pull secrets for private registries
# @default -- `[]`
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Automount the ServiceAccount API credentials
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- ServiceAccount name (generated from fullname if not set)
  name: ""

# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}

# -- Container-level security context
securityContext: {}

# -- Extra environment variables (map format, deep-mergeable)
extraEnv: {}
  # Simple value:
  #   MY_VAR: "value"
  # From a Secret:
  #   MY_SECRET:
  #     valueFrom:
  #       secretKeyRef:
  #         name: secret-name
  #         key: secret-key
  # From a ConfigMap:
  #   MY_CONFIG:
  #     valueFrom:
  #       configMapKeyRef:
  #         name: configmap-name
  #         key: config-key

# -- Extra envFrom sources
# @default -- `[]` (See [values.yaml])
extraEnvFrom: []
  # - configMapRef:
  #     name: config-map-name
  # - secretRef:
  #     name: secret-name

service:
  # -- Create a Service
  enabled: true
  # -- Service type (`ClusterIP`, `NodePort`, `LoadBalancer`)
  type: ClusterIP
  # -- Service port
  port: 80

ingress:
  # -- Enable Ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Raw ingress host entries (unstructured, for advanced use)
  hostsRaw: []
  # -- Ingress host rules
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration
  tls: []

# -- Expose the service via Gateway API HTTPRoute
httpRoute:
  # -- Enable HTTPRoute
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Parent gateway references
  parentRefs:
  - name: gateway
    sectionName: http
  # -- Hostnames to match
  hostnames:
  - chart-example.local
  # -- Routing rules and filters
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

# -- Resource requests and limits
resources: {}

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http
# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  # -- Set to true when using an external autoscaler (e.g. KEDA) to skip built-in HPA
  external: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 100
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Additional volumes
volumes: []

# -- Additional volume mounts
volumeMounts: []

# -- Node selector constraints
nodeSelector: {}

# -- Pod tolerations
tolerations: []

# -- Pod affinity rules
affinity: {}

# -- Array of extra K8s manifests to deploy
extraObjects: []
