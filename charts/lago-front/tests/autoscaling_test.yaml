suite: Test autoscaling configuration
templates:
  - templates/deployment.yaml
  - templates/hpa.yaml

values:
  - ../values.yaml

tests:
  - it: should set replicas when autoscaling is disabled
    template: templates/deployment.yaml
    set:
      global.urls.api: "http://api.lago.dev"
      replicaCount: 3
      autoscaling.enabled: false
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should not set replicas when autoscaling is enabled
    template: templates/deployment.yaml
    set:
      global.urls.api: "http://api.lago.dev"
      replicaCount: 3
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: should not set replicas when external autoscaling is enabled
    template: templates/deployment.yaml
    set:
      global.urls.api: "http://api.lago.dev"
      replicaCount: 3
      autoscaling.enabled: true
      autoscaling.external: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: should deploy HPA when autoscaling is enabled and not external
    template: templates/hpa.yaml
    set:
      global.urls.api: "http://api.lago.dev"
      autoscaling.enabled: true
      autoscaling.external: false
    asserts:
      - containsDocument:
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler

  - it: should not deploy HPA when autoscaling is disabled
    template: templates/hpa.yaml
    set:
      global.urls.api: "http://api.lago.dev"
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not deploy HPA when external autoscaling is enabled (KEDA)
    template: templates/hpa.yaml
    set:
      global.urls.api: "http://api.lago.dev"
      autoscaling.enabled: true
      autoscaling.external: true
    asserts:
      - hasDocuments:
          count: 0
