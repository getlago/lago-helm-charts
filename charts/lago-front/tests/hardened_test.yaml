suite: Test the hardened image defaults
templates:
  - templates/deployment.yaml

values:
  - ../values.yaml

set:
  global.urls.api: "http://api.lago.dev"

tests:
  - it: should listen on 8080 by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: http
            containerPort: 8080
            protocol: TCP

  - it: should run as uid 65532 with a RuntimeDefault seccomp profile
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault

  - it: should drop all capabilities and use a read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

  - it: should mount a tmp emptyDir at /tmp
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: should let a legacy root image opt out
    set:
      container.ports.http: 80
      podSecurityContext: null
      securityContext: null
      volumes: null
      volumeMounts: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext
      - notExists:
          path: spec.template.spec.volumes
