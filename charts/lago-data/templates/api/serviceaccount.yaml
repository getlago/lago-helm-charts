{{- if .Values.api.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lago-data.api.serviceAccountName" . }}
  labels:
    {{- include "lago-data.labels" (dict "context" . "component" .Values.api.name "name" .Values.api.name) | nindent 4 }}
    {{- with .Values.api.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.api.serviceAccount.automount }}
{{- end }}
