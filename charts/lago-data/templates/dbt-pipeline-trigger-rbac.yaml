{{- if and .Values.global.dbtPipeline.enabled .Values.dbtPipeline.trigger.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lago-data.fullname" . }}-dbt-pipeline-trigger
  labels:
    {{- include "lago-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: dbt-pipeline-trigger
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lago-data.fullname" . }}-dbt-pipeline-trigger
  labels:
    {{- include "lago-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: dbt-pipeline-trigger
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lago-data.fullname" . }}-dbt-pipeline-trigger
  labels:
    {{- include "lago-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: dbt-pipeline-trigger
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lago-data.fullname" . }}-dbt-pipeline-trigger
subjects:
  - kind: ServiceAccount
    name: {{ include "lago-data.fullname" . }}-dbt-pipeline-trigger
    namespace: {{ .Release.Namespace }}
{{- end }}
