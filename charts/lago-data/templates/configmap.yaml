{{- if .Values.configs.cm.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lago-data.configMapName" . }}
  labels:
    {{- include "lago-data.labels" (dict "context" . "component" .Values.api.name "name" "secret") | nindent 4 }}
    {{- with .Values.configs.secret.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configs.secret.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  {{- include "lago-data.configs.cm" . | trim | nindent 2 }}
{{- end }}
