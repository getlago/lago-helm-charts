global:
  ago:
    env: "production"
    license: ""

  config:
    configmap:
    secret:

  urls:
    api: ""
    front: ""
    pdf: ""

  database:
    uri: ""
    pool: 20

  encryption:
    key: ""  # ENCRYPTION_PRIMARY_KEY
    salt: ""  # ENCRYPTION_KEY_DERIVATION_SALT

  signing:
    hmac: ""  # SECRET_KEY_BASE used by webhooks, message verifier HS256
    rsa: ""  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

  redis:
    url: ""
    password: ""

  redisCache:
    url: ""
    password: ""

  redisStore:
    url: ""
    password: ""

  sentryDsn: ""

  databaseAnalytical:
    host: ""
    name: ""
    user: ""
    password: ""
    port: 5432
    schema: analytical

  databaseReplica:
    host: ""
    name: ""
    user: ""
    password: ""
    port: 5432

  dbtPipeline:
    enabled: false
    sourceSchema: public
    targetSchema: analytical
    tables: []

  forecastedUsage:
    enabled: false
    # forecasted usage need to call lago-api, hence provide a valid token
    api_token:
    celery:
      brokerUrl: ""
      resultBackend: ""

  data:
    configmap:
    secret:
    # token to validate calls from lago-api
    token:

config:
  nameOverride: lago-config

data-config:
  nameOverride: lago-data-config

api:
  nameOverride: lago-api
  config:
    enabled: false
    nameOverride: lago-config

  extraEnv:
    LAGO_DATA_API_BEARER_TOKEN:
      valueFrom:
        secretKeyRef:
          name: lago-data-config
          key: api.token

data-api:
  nameOverride: lago-data-api
  config:
    enabled: false
    nameOverride: lago-data-config
    api:
      url: lago-api  # this is the value of the api.fullnameOverride


data-worker:
  nameOverride: lago-data-worker
  config:
    enabled: false
    nameOverride: lago-data-config
    api:
      url: http://lago-api

# DBT Pipeline CronJob configuration
dbtPipeline:
  image:
    repository: getlago/data-dbt-pipeline
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  container:
    command: []
    args: []

  # CronJob specific configuration
  cronjob:
    schedule: "0 5 * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    startingDeadlineSeconds:
    suspend: false
    activeDeadlineSeconds:
    backoffLimit: 0
    restartPolicy: Never

  # Trigger job on install via helm hook
  trigger:
    enabled: false
    image:
      repository: rancher/kubectl
      tag: latest

  serviceAccount:
    create: true
    automount: true
    annotations: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: []
  # -- Additional environment variables (map format, deep-mergeable)
  extraEnv: {}
    # Simple value:
    #   MY_VAR: "value"
    # From a Secret:
    #   MY_SECRET:
    #     valueFrom:
    #       secretKeyRef:
    #         name: secret-name
    #         key: secret-key
    # From a ConfigMap:
    #   MY_CONFIG:
    #     valueFrom:
    #       configMapKeyRef:
    #         name: configmap-name
    #         key: config-key
