data-config:
  databaseAnalytical:
    host: ""
    name: ""
    user: ""
    password: ""
    port: 5432
    schema: analytical

  celery:
    brokerUrl: ""
    resultBackend: ""

  api:
    token:

  configMap:
    name: lago-data-config

config:
  database:
    url: ""

  encryption:
    key: "" # ENCRYPTION_PRIMARY_KEY
    salt: "" # ENCRYPTION_KEY_DERIVATION_SALT

  signing:
    hmac: # SECRET_KEY_BASE used by webhooks, message verifier HS256
    rsa:  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

  redis:
    url: ""
    password: ""

  redisCache:
    url: ""
    password: ""

  redisStore:
    url: ""
    password: ""

  configMap:
    name: lago-config

api:
  fullnameOverride: lago-api
  config:
    enabled: false

  existingConfigMap: lago-config
  existingSecret: lago-config

  extraEnv:
    - name: LAGO_DATA_API_BEARER_TOKEN
      valueFrom:
        secretKeyRef:
          name: lago-data-config
          key: api.token

data-api:
  fullnameOverride: lago-data-api
  config:
    api:
      url: lago-api # this is the value of the api.fullnameOverride

  existingConfigMap: lago-data-config
  existingSecret: lago-data-config

data-worker:
  fullnameOverride: lago-data-worker
  config:
    api:
      url: http://lago-api

  existingConfigMap: lago-data-config
  existingSecret: lago-data-config

celery-exporter:
  env:
    - name: CE_BROKER_URL
      valueFrom:
        configMapKeyRef:
          name: lago-data-config
          key: celery.brokerUrl

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

  podAnnotations:
    prometheus.io/scrape: "true"
