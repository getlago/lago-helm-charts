suite: Test lago-data-config secret
templates:
  - templates/secret.yaml

tests:
  - it: should create secret by default
    set:
      secret.create: true
      global.data.token: "test-token"
    release:
      name: my-release
    chart:
      name: lago-data-config
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: should not create secret when secret.create is false
    set:
      secret.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use default secret name when no custom name is set
    set:
      secret.create: true
      global.data.token: "test-token"
    release:
      name: my-release
    chart:
      name: lago-data-config
    asserts:
      - equal:
          path: metadata.name
          value: my-release-lago-data-config

  - it: should use secret.name when provided
    set:
      secret.create: true
      secret.name: "custom-secret"
      global.data.token: "test-token"
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret

  - it: should use data.secret.name when provided
    set:
      secret.create: true
      data.secret.name: "data-secret"
      global.data.token: "test-token"
    asserts:
      - equal:
          path: metadata.name
          value: data-secret

  - it: should use global.data.secret when provided
    set:
      secret.create: true
      global.data.secret: "global-secret"
      global.data.token: "test-token"
    asserts:
      - equal:
          path: metadata.name
          value: global-secret

  - it: should prioritize secret.name over data.secret.name
    set:
      secret.create: true
      secret.name: "direct-secret"
      data.secret.name: "data-secret"
      global.data.token: "test-token"
    asserts:
      - equal:
          path: metadata.name
          value: direct-secret

  - it: should prioritize secret.name over global.data.secret
    set:
      secret.create: true
      secret.name: "direct-secret"
      global.data.secret: "global-secret"
      global.data.token: "test-token"
    asserts:
      - equal:
          path: metadata.name
          value: direct-secret

  - it: should prioritize data.secret.name over global.data.secret
    set:
      secret.create: true
      data.secret.name: "data-secret"
      global.data.secret: "global-secret"
      global.data.token: "test-token"
    asserts:
      - equal:
          path: metadata.name
          value: data-secret
