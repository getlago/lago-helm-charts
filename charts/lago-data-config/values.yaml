# Default values for lago-data-config.

global:
  databaseAnalytical:
    # -- Analytical database host
    host: ""
    # -- Analytical database name
    name: ""
    # -- Analytical database user
    user: ""
    # -- Analytical database password
    password: ""
    # -- Analytical database port
    port: 5432
    # -- Analytical database schema
    schema: analytical

  forecastedUsage:
    # -- Enable forecasted usage feature
    enabled: false
    # -- Lago API token for forecasted usage calls
    api_token:
    celery:
      # -- Celery broker URL
      brokerUrl: ""
      # -- Celery result backend URL
      resultBackend: ""

  dbtPipeline:
    # -- Enable dbt pipeline
    enabled: false
    # -- Source schema for dbt pipeline
    sourceSchema: public
    # -- Target schema for dbt pipeline
    targetSchema: analytical
    # -- Tables to replicate
    tables: []

  databaseReplica:
    # -- Replica database host
    host: ""
    # -- Replica database name
    name: ""
    # -- Replica database user
    user: ""
    # -- Replica database password
    password: ""
    # -- Replica database port
    port: 5432

  data:
    # -- Name of an existing ConfigMap for data configuration
    configmap:
    # -- Name of an existing Secret for data configuration
    secret:
    # -- API token to validate calls from lago-api
    token:

configmap:
  # -- Create the ConfigMap (set to false when using an externally managed ConfigMap)
  create: true
  # -- Override the ConfigMap name (generated from fullname if not set)
  name: ""
  # -- Additional labels for the ConfigMap
  labels: {}
  # -- Additional annotations for the ConfigMap
  annotations: {}

secret:
  # -- Create the Secret for sensitive configuration
  create: true
  # -- Override the Secret name (generated from fullname if not set)
  name: ""
  # -- Additional labels for the Secret
  labels: {}
  # -- Additional annotations for the Secret
  annotations: {}
