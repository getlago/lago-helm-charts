# Default values for lago-config.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  databaseAnalytical:
    host: ""
    name: ""
    user: ""
    password: ""
    port: 5432
    schema: analytical

  forecastedUsage:
    enabled: false
    # forecasted usage need to call lago-api, hence provide a valid token
    api_token:
    celery:
      brokerUrl: ""
      resultBackend: ""

  data:
    configmap:
    secret:
    # token to validate calls from lago-api
    token:


configmap:
  # The name of the config map to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

  # -- Labels to be added to lago-config configmap
  labels: {}
  # -- Annotations to be added to lago-config configmap
  annotations: {}

secret:
  # -- Create the lago-config secret for [sensitive config]
  create: true

  # The name of the secret to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

  # -- Labels to be added to lago-config secret
  labels: {}
  # -- Annotations to be added to lago-config secret
  annotations: {}
