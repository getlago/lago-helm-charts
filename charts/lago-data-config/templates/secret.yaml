{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lago-data-config.secretName" . }}
  labels:
    {{- include "lago-data-config.labels" . | nindent 4 }}
    {{- with .Values.secret.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
type: Opaque
data:
  databaseAnalytical.password: {{ b64enc .Values.databaseAnalytical.password }}
  api.token: {{ b64enc .Values.api.token }}
{{- end }}
