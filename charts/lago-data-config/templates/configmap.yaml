apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lago-data-config.configMapName" . }}
  labels:
    {{- include "lago-data-config.labels" . | nindent 4 }}
    {{- with .Values.configmap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configmap.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  databaseAnalytical.host: {{ required "global.databaseAnalytical.host is required" .Values.global.databaseAnalytical.host }}
  databaseAnalytical.name: {{ required "global.databaseAnalytical.name is required" .Values.global.databaseAnalytical.name }}
  databaseAnalytical.user: {{ required "global.databaseAnalytical.user is required" .Values.global.databaseAnalytical.user }}
  databaseAnalytical.port: {{ required "global.databaseAnalytical.port is required" .Values.global.databaseAnalytical.port | quote }}
  databaseAnalytical.schema: {{ required "global.databaseAnalytical.schema is required" .Values.global.databaseAnalytical.schema }}
  {{- if .Values.global.forecastedUsage.enabled }}
  celery.brokerUrl: {{ required "global.forecastedUsage.celery.brokerUrl is required" .Values.global.forecastedUsage.celery.brokerUrl }}
  celery.resultBackend: {{ required "global.forecastedUsage.celery.resultBackend is required" .Values.global.forecastedUsage.celery.resultBackend }}
  {{- end }}
  {{- if .Values.global.dbtPipeline.enabled }}
  dbt.sourceSchema: {{ required "global.dbtPipeline.sourceSchema is required" .Values.global.dbtPipeline.sourceSchema }}
  dbt.targetSchema: {{ required "global.dbtPipeline.targetSchema is required" .Values.global.dbtPipeline.targetSchema }}
  {{- if not (empty .Values.global.dbtPipeline.tables) }}
  databaseReplica.host: {{ required "global.databaseReplica.host is required" .Values.global.databaseReplica.host }}
  databaseReplica.name: {{ required "global.databaseReplica.name is required" .Values.global.databaseReplica.name }}
  databaseReplica.user: {{ required "global.databaseReplica.user is required" .Values.global.databaseReplica.user }}
  databaseReplica.port: {{ required "global.databaseReplica.port is required" .Values.global.databaseReplica.port | quote }}
  refresh.tables: {{ join " " . }}
  {{- end }}
  {{- end }}
