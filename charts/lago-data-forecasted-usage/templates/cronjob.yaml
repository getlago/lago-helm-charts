apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lago-data-forecasted-usage.fullname" . }}
  labels:
    {{- include "lago-data-forecasted-usage.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  {{- with .Values.cronjob.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  suspend: {{ .Values.cronjob.suspend }}
  jobTemplate:
    metadata:
      labels:
        {{- include "lago-data-forecasted-usage.labels" . | nindent 8 }}
    spec:
      {{- with .Values.cronjob.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with .Values.cronjob.backoffLimit }}
      backoffLimit: {{ . }}
      {{- end }}
      template:
        metadata:
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "lago-data-forecasted-usage.labels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "lago-data-forecasted-usage.serviceAccountName" . }}
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: {{ .Values.cronjob.restartPolicy }}
          containers:
            - name: {{ default .Chart.Name .Values.container.name }}
              {{- with .Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: {{ toJson .Values.container.command }}
              args: {{ toJson .Values.container.args }}
              env:
                - name: ANALYTICAL_DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "lago-data-forecasted-usage.configMapName" . }}
                      key: databaseAnalytical.host
                - name: ANALYTICAL_DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "lago-data-forecasted-usage.configMapName" . }}
                      key: databaseAnalytical.name
                - name: ANALYTICAL_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "lago-data-forecasted-usage.secretName" . }}
                      key: databaseAnalytical.password
                - name: ANALYTICAL_DB_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "lago-data-forecasted-usage.configMapName" . }}
                      key: databaseAnalytical.port
                - name: ANALYTICAL_DB_SCHEMA
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "lago-data-forecasted-usage.configMapName" . }}
                      key: databaseAnalytical.schema
                - name: ANALYTICAL_DB_USER
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "lago-data-forecasted-usage.configMapName" . }}
                      key: databaseAnalytical.user
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "lago-data-forecasted-usage.s3.secretName" . }}
                      key: s3.accessKeyId
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "lago-data-forecasted-usage.s3.secretName" . }}
                      key: s3.secretAccessKey
                - name: ML_CONFIG_YAML
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "lago-data-forecasted-usage.ml.secretName" . }}
                      key: ml.config
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.volumeMounts }}
              volumeMounts:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          {{- with .Values.volumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
