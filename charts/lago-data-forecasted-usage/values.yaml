# Default values for lago-data-forecasted-usage.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  databaseAnalytical:
    host: ""
    name: ""
    user: ""
    password: ""
    port: 5432
    schema: analytical

  data:
    token: some_token  # make data-config happy

config:
  enabled: true
  nameOverride: lago-data-forecasted-usage

  s3:
    secret:
      create: true
      name:
    accessKeyId:
    secretAccessKey:

  ml:
    secret:
      create: true
      name:
    config: |


# CronJob specific configuration
cronjob:
  # Schedule in Cron format, see https://en.wikipedia.org/wiki/Cron
  schedule: "0 */6 * * *"

  # Specifies how to treat concurrent executions of a Job
  # Options: Allow, Forbid, Replace
  concurrencyPolicy: Forbid

  # The number of successful finished jobs to retain
  successfulJobsHistoryLimit: 3

  # The number of failed finished jobs to retain
  failedJobsHistoryLimit: 1

  # Optional deadline in seconds for starting the job if it misses scheduled time
  startingDeadlineSeconds:

  # This flag tells the controller to suspend subsequent executions
  suspend: false

  # Specifies the duration in seconds relative to the startTime that the job may be active
  activeDeadlineSeconds:

  # Specifies the number of retries before marking this job failed
  backoffLimit: 0

  # Restart policy for the pod. Options: OnFailure, Never
  restartPolicy: Never

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: getlago/lago-data-ml

  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

container:
  name: ""
  command: ["/bin/bash", "-c"]
  args: ["python run.py --mode train && python run.py --mode forecast"]

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Environment variables to pass to the container (map format, deep-mergeable)
extraEnv: {}
  # Simple value:
  #   MY_VAR: "value"
  # From a Secret:
  #   MY_SECRET:
  #     valueFrom:
  #       secretKeyRef:
  #         name: secret-name
  #         key: secret-key
  # From a ConfigMap:
  #   MY_CONFIG:
  #     valueFrom:
  #       configMapKeyRef:
  #         name: configmap-name
  #         key: config-key

# -- envFrom to pass to the container
# @default -- `[]` (See [values.yaml])
extraEnvFrom: []
  # - configMapRef:
  #     name: config-map-name
  # - secretRef:
  #     name: secret-name

# Additional volumes on the output CronJob definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output CronJob definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
