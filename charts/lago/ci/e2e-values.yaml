global:
  urls:
    api: "http://lago-api.default.svc.cluster.local:3000"
    front: "http://lago-front.default.svc.cluster.local:80"

  database:
    uri: "postgres://lago:some_password@lago-postgres.default.svc.cluster.local:5432/lago"

  encryption:
    key: "911219513a368a9f5cb38b326e739a70"
    salt: "cabaabf712d9f7b2ce0ae1b12fc01eec"

  signing:
    rsa: 
    hmac: SOswQPXojXToX/l7R/FXUw==

  redis:
    uri: "redis://lago-redis.default.svc.cluster.local:6379"

  redisCache:
    uri: "redis://lago-redis.default.svc.cluster.local:6379"

  redisStore:
    uri: "redis://lago-redis.default.svc.cluster.local:6379"

migrate:
  enabled: true
  initContainers:
    - name: wait-for-db
      image: busybox:1.37
      command: ["sh", "-c", "until nc -z lago-postgres 5432; do echo 'waiting for postgres...'; sleep 2; done"]
    - name: wait-for-redis
      image: busybox:1.37
      command: ["sh", "-c", "until nc -z lago-redis 6379; do echo 'waiting for redis...'; sleep 2; done"]

extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: lago-redis
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      selector:
        app: redis
      ports:
        - port: 6379
          targetPort: 6379
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: lago-redis
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: redis
      template:
        metadata:
          labels:
            app: redis
        spec:
          containers:
            - name: redis
              image: redis:7-alpine
              ports:
                - containerPort: 6379
              livenessProbe:
                exec:
                  command:
                    - redis-cli
                    - ping
                initialDelaySeconds: 15
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
                successThreshold: 1

  - apiVersion: v1
    kind: Service
    metadata:
      name: lago-postgres
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      selector:
        app: postgres
      ports:
        - port: 5432
          targetPort: 5432
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: lago-postgres
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: postgres
      template:
        metadata:
          labels:
            app: postgres
        spec:
          containers:
            - name: postgres
              image: getlago/postgres-partman:15.0-alpine
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRES_USER
                  value: "lago"
                - name: POSTGRES_PASSWORD
                  value: "some_password"
                - name: POSTGRES_DB
                  value: "lago"
              livenessProbe:
                exec:
                  command:
                    - pg_isready
                    - -U
                    - postgres
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
                successThreshold: 1
