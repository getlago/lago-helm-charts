{{/*
Deploy-time guards for the umbrella chart. Renders no object — it exists so a
combination Helm's `condition` field cannot express (a dependency gated on one
flag that also needs another) fails at template time with a readable message,
instead of rolling out a pod that crash-loops.
*/}}
{{- range $name := keys .Values.global.streaming_ingestion.consumers | sortAlpha }}
{{- if and (include "lago-config.streaming.consumerEnabled" (dict "name" $name "global" $.Values.global)) (not $.Values.global.streaming_ingestion.enabled) }}
{{- fail (printf "global.streaming_ingestion.consumers.%s requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on" $name) }}
{{- end }}
{{- end }}
