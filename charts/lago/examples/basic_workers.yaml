global:
  lago:
    pdfGeneration: true

  urls:
    api: "https://lago-api.example.com"
    front: "https://lago.example.com"

  database:
    uri: "postgres://lago:some_password@lago-postgres.default.svc.cluster.local:5432/lago"

  encryption:
    # openssl rand -hex 16
    key: 911219513a368a9f5cb38b326e739a70

    # openssl rand -hex 16
    salt: cabaabf712d9f7b2ce0ae1b12fc01eec

  sidekiq:
    queues:
      billing: true
      clock: true
      events: true
      webhook: true
      pdf: true

  signing:
    # openssl genrsa 512 | openssl base64 -A (use a higher rsa size)
    rsa: 
    # openssl rand -base64 16
    hmac: SOswQPXojXToX/l7R/FXUw==

  redis:
    uri: "redis://lago-redis.default.svc.cluster.local:6379"

  redisCache:
    uri: "redis://lago-redis.default.svc.cluster.local:6379"

  redisStore:
    uri: "redis://lago-redis.default.svc.cluster.local:6379"

migrate:
  enabled: true

api:
  ingress:
    enabled: true
    hosts:
      - host: lago-api.example.com
    tls:
      - secretName: lago-api-example-tls
        hosts:
          - lago-api.example.com

front:
  ingress:
    enabled: true
    hosts:
      - host: lago.example.com
    tls:
      - secretName: lago-example-tls
        hosts:
          - lago.example.com

extraObjects:
  - apiVersion: v1
    kind: Service
    metadata:
      name: lago-redis
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      selector:
        app: redis
      ports:
        - port: 6379
          targetPort: 6379
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: lago-redis
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: redis
      template:
        metadata:
          labels:
            app: redis
        spec:
          containers:
            - name: redis
              image: redis:7-alpine
              ports:
                - containerPort: 6379
              livenessProbe:
                exec:
                  command:
                    - redis-cli
                    - ping
                initialDelaySeconds: 15
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
                successThreshold: 1

  - apiVersion: v1
    kind: Service
    metadata:
      name: lago-postgres
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      selector:
        app: postgres
      ports:
        - port: 5432
          targetPort: 5432
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: lago-postgres
      annotations:
        "helm.sh/hook": pre-install
        "helm.sh/hook-weight": "-10"
        "helm.sh/hook-delete-policy": before-hook-creation
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: postgres
      template:
        metadata:
          labels:
            app: postgres
        spec:
          containers:
            - name: postgres
              image: getlago/postgres-partman:15.0-alpine
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRES_USER
                  value: "lago"
                - name: POSTGRES_PASSWORD
                  value: "some_password"
                - name: POSTGRES_DB
                  value: "lago"
              livenessProbe:
                exec:
                  command:
                    - pg_isready
                    - -U
                    - postgres
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
                successThreshold: 1
