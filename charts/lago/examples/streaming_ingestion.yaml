global:
  lago:
    version: sha-1112223
    env: staging
    cloud: true

  urls:
    api: https://test-lago-api.example.com
    front: https://test-lago.example.com
    pdf: http://pdf.default.svc.cluster.local

  database:
    uri: "postgres://lago:some_password@lago-postgres.svc.cluster.local:5432/lago"

  encryption:
    # openssl rand -hex 16
    key: 911219513a368a9f5cb38b326e739a70

    # openssl rand -hex 16
    salt: cabaabf712d9f7b2ce0ae1b12fc01eec

  signing:
    # openssl genrsa 512 | openssl base64 -A (use a higher rsa size)
    rsa: 
    # openssl rand -base64 16
    hmac: SOswQPXojXToX/l7R/FXUw==

  redis:
    uri: "redis://lago-redis.svc.cluster.local:6379"

  redisCache:
    uri: "redis://lago-redis.svc.cluster.local:6379"

  redisStore:
    uri: "redis://lago-redis.svc.cluster.local:6379"
  # config:
  #   configmap: test-lago-config
  #   secret: test-lago-config

  data:
    enabled: true
    endpoint: http://data-api.default.svc.cluster.local
    token: data_token

  streaming_ingestion:
    enabled: true
    clickhouse:
      database: lago
      username: lago_clickhouse
      password: clickhouse_password
      port: 8123
      address: clickhouse.default.svc.cluster.local

    kafka:
      bootstrapServers:
        - redpanda.default.svc.cluster.local:9093
      consumerGroup: consumer
      topics:
        activityLogs: activity_logs
        apiLogs: api_logs
        eventsChargedInAdvance: events-charged-in-advance
        eventsDeadLetter: events-dead-letter
        eventsEnriched: events-enriched
        eventsEnrichedExpanded: events-enriched-expanded
        eventsRaw: events-raw


  s3:
    enabled: true
    region: us-east-1
    bucket: lago-test
    # examples credentials: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    accessKeyId: AKIAIOSFODNN7EXAMPLE
    secretAccessKey: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

  smtp:
    enabled: true
    from: noreply@example.com
    port: 1025
    address: mailhog-web.default.svc.cluster.local

  google:
    enabled: true

  gocardless:
    enabled: true
    proxy: https://test-proxy.example.com
    clientId: gocardless_client_id
    clientSecret: gocardless_client_secret

  mcp:
    enabled: true
    clientId: mcp_client_id
    clientSecret: mcp_client_secret
    endpoint: http://lago-mcp-server.default.svc.cluster.local/mcp

api:
  ingress:
    enabled: true
    hosts:
      - host: test-lago-api.example.com
    tls:
      - secretName: test-lago-api-example-tls
        hosts:
          - test-lago-api.example.com

front:
  image:
    tag: sha-4445556

  ingress:
    enabled: true
    hosts:
      - host: test-lago.example.com
    tls:
      - secretName: test-lago-example-tls
        hosts:
          - test-lago.example.com
