suite: Test webhook-alert-worker subchart is wired to the
  global.sidekiq.queues.webhookAlert toggle, and that every lago-rails pod
  exposes SIDEKIQ_WEBHOOK_ALERT so alert webhooks are enqueued on its queue.
templates:
  - charts/webhook-alert-worker/templates/deployment.yaml
  - charts/api/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    sidekiq:
      queues:
        webhookAlert: true

tests:
  - it: renders the webhook-alert-worker deployment with its dedicated start script
    template: charts/webhook-alert-worker/templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-webhook-alert-worker
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./scripts/start.webhook_alert.worker.sh"]

  - it: exposes SIDEKIQ_WEBHOOK_ALERT on lago-rails pods derived from the queue toggle
    template: charts/api/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIDEKIQ_WEBHOOK_ALERT
            value: "true"

  - it: sets SIDEKIQ_WEBHOOK_ALERT to false on lago-rails pods when the toggle is off
    template: charts/api/templates/deployment.yaml
    set:
      global.sidekiq.queues.webhookAlert: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIDEKIQ_WEBHOOK_ALERT
            value: "false"
