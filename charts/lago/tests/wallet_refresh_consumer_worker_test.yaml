suite: Test wallet-refresh-consumer-worker subchart is gated by wallet-refresh-consumer-worker.enabled,
  runs the Karafka entrypoint and routes only the realtime usage triggers topic
  (the charged-in-advance topic inherited from the streaming ConfigMap is blanked).
templates:
  - charts/wallet-refresh-consumer-worker/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: renders the deployment with the Karafka entrypoint when enabled
    set:
      wallet-refresh-consumer-worker.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-wallet-refresh-consumer-worker
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./scripts/start.events.consumer.sh"]

  - it: sets the realtime usage triggers topic and blanks the charged-in-advance topic
    set:
      wallet-refresh-consumer-worker.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_REALTIME_USAGE_TRIGGERS_TOPIC
            value: realtime_usage_triggers
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_EVENTS_CHARGED_IN_ADVANCE_TOPIC
            value: ""

  - it: allows overriding the realtime usage triggers topic
    set:
      wallet-refresh-consumer-worker.enabled: true
      wallet-refresh-consumer-worker.extraEnv.LAGO_KAFKA_REALTIME_USAGE_TRIGGERS_TOPIC: custom_triggers
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_REALTIME_USAGE_TRIGGERS_TOPIC
            value: custom_triggers
