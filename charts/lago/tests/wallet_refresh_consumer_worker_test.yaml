suite: Test wallet-refresh-consumer-worker subchart is gated by
  global.streaming_ingestion.consumers.walletRefresh.enabled, runs the Karafka server pinned to
  the wallet refresh consumer group (so the wallet alerts topic it produces to is not
  consumed here). Its realtime usage triggers topic comes from the streaming ConfigMap
  (covered in lago-config); the pairing with streaming ingestion is
  enforced in templates/validations.yaml and covered by validations_test.yaml.
templates:
  - charts/wallet-refresh-consumer-worker/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: renders the deployment with the Karafka server pinned to its consumer group when enabled
    set:
      global.streaming_ingestion.consumers.walletRefresh.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-wallet-refresh-consumer-worker
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["bundle", "exec", "karafka", "server", "--include_consumer_groups", "lago_wallet_refresh_triggers_consumer"]

  - it: reads the realtime usage triggers topic from the streaming ConfigMap, with no override
    set:
      global.streaming_ingestion.consumers.walletRefresh.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_REALTIME_USAGE_TRIGGERS_TOPIC
          any: true

  - it: keeps the wallet alerts topic from the streaming ConfigMap, as it produces wallet alerts
    set:
      global.streaming_ingestion.consumers.walletRefresh.enabled: true
      global.streaming_ingestion.consumers.walletAlerts.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-lago-config-streaming
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_WALLET_ALERTS_TOPIC
          any: true
