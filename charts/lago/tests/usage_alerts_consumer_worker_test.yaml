suite: Test usage-alerts-consumer-worker subchart is gated by
  global.streaming_ingestion.usageAlertsConsumer, runs the Karafka server pinned to
  the usage alerts consumer group (the wallet refresh group reads the same topic),
  routes only the realtime usage triggers topic and turns the lane on in its pod. The
  pairing with streaming ingestion is enforced in templates/validations.yaml and
  covered by validations_test.yaml.
templates:
  - charts/usage-alerts-consumer-worker/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: renders the deployment with the Karafka server pinned to its consumer group when enabled
    set:
      global.streaming_ingestion.usageAlertsConsumer: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-usage-alerts-consumer-worker
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["bundle", "exec", "karafka", "server", "--include_consumer_groups", "lago_usage_alerts_consumer"]

  - it: sets the triggers topic, turns the lane on and blanks the charged-in-advance topics
    set:
      global.streaming_ingestion.usageAlertsConsumer: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_REALTIME_USAGE_TRIGGERS_TOPIC
            value: realtime_usage_triggers
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_REALTIME_USAGE_ALERTS_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_EVENTS_CHARGED_IN_ADVANCE_TOPIC
            value: ""
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_PRODUCT_EVENTS_CHARGED_IN_ADVANCE_TOPIC
            value: ""

  - it: allows overriding the realtime usage triggers topic
    set:
      global.streaming_ingestion.usageAlertsConsumer: true
      usage-alerts-consumer-worker.extraEnv.LAGO_KAFKA_REALTIME_USAGE_TRIGGERS_TOPIC: custom_triggers
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_REALTIME_USAGE_TRIGGERS_TOPIC
            value: custom_triggers
