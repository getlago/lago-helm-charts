suite: Test product-events-processor-worker subchart is gated by
  global.streaming_ingestion.consumers.productEvents.enabled and runs the events processor's
  product events pipeline in its own Deployment, next to events-processor-worker. The
  pairing with global.streaming_ingestion.enabled is enforced in
  templates/validations.yaml and covered by validations_test.yaml.
templates:
  - charts/product-events-processor-worker/templates/deployment.yaml
  - charts/events-processor-worker/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: renders its own deployment when enabled
    set:
      global.streaming_ingestion.consumers.productEvents.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: charts/product-events-processor-worker/templates/deployment.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-product-events-processor-worker
        template: charts/product-events-processor-worker/templates/deployment.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: lago-product-events-processor-worker
        template: charts/product-events-processor-worker/templates/deployment.yaml

  - it: selects the product events pipeline and keeps the consumer group override
    set:
      global.streaming_ingestion.consumers.productEvents.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_EVENTS_PROCESSOR_PIPELINE
            value: product_events
        template: charts/product-events-processor-worker/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_CONSUMER_GROUP
            valueFrom:
              configMapKeyRef:
                name: lago-config-streaming
                key: LAGO_KAFKA_CONSUMER_GROUP_EVENTS_PROCESSOR
                optional: true
        template: charts/product-events-processor-worker/templates/deployment.yaml

  - it: leaves the events processor on its default pipeline
    set:
      global.streaming_ingestion.consumers.productEvents.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_EVENTS_PROCESSOR_PIPELINE
            value: product_events
        template: charts/events-processor-worker/templates/deployment.yaml
