suite: Test that the lago-rails pods carry a checksum of the streaming ConfigMap
  data as a pod template annotation, so that any change to it (e.g. flipping
  global.streaming_ingestion.walletAlertsConsumer, which adds or drops
  LAGO_KAFKA_WALLET_ALERTS_TOPIC) rolls every pod that reads it through envFrom.
templates:
  - charts/api/templates/deployment.yaml
  - charts/worker/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: annotates the pod template with the streaming ConfigMap checksum
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/streaming-config"]
          pattern: ^[0-9a-f]{64}$

  - it: changes the checksum when the wallet alerts toggle changes
    set:
      global.streaming_ingestion.walletAlertsConsumer: true
    template: charts/api/templates/deployment.yaml
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/streaming-config"]
          value: 62167b5b820f029a668fb2ba510216c15bdde0f2dd75eb692edae66018d8b290

  - it: changes the checksum when a streaming topic changes
    set:
      global.streaming_ingestion.kafka.topics.eventsRaw: other_events_raw
    template: charts/api/templates/deployment.yaml
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/streaming-config"]
          value: 62167b5b820f029a668fb2ba510216c15bdde0f2dd75eb692edae66018d8b290

  - it: keeps the user pod annotations next to the checksum
    set:
      api.podAnnotations:
        example.com/foo: bar
    template: charts/api/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/foo"]
          value: bar
      - equal:
          path: spec.template.metadata.annotations["checksum/streaming-config"]
          value: 62167b5b820f029a668fb2ba510216c15bdde0f2dd75eb692edae66018d8b290

  - it: renders no checksum without streaming ingestion
    set:
      global.streaming_ingestion.enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/streaming-config"]
