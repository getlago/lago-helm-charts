suite: Test the umbrella deploy-time guards in templates/validations.yaml. Helm's
  `condition` field cannot express two flags set together, so one loop over
  global.streaming_ingestion.consumers fails the render with a readable message
  instead of rolling out a pod that crash-loops.
templates:
  - templates/validations.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost

tests:
  - it: refuses the wallet refresh consumer when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.consumers.walletRefresh.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.walletRefresh requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: refuses the wallet alerts consumer when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.consumers.walletAlerts.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.walletAlerts requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: refuses the product events processor when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.consumers.productEvents.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.productEvents requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: refuses the usage attribution consumer when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.consumers.usageAttribution.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.usageAttribution requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: renders nothing once every consumer has streaming ingestion
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      global.streaming_ingestion.consumers.walletRefresh.enabled: true
      global.streaming_ingestion.consumers.walletAlerts.enabled: true
      global.streaming_ingestion.consumers.productEvents.enabled: true
      global.streaming_ingestion.consumers.usageAttribution.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses a 2.1.4 flag without its new key
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      global.streaming_ingestion.walletRefreshConsumer: true
    asserts:
      - failedTemplate:
          errorMessage: 'global.streaming_ingestion.walletRefreshConsumer was replaced by global.streaming_ingestion.consumers.walletRefresh.enabled: set the new key (you can keep both for one upgrade)'

  - it: accepts a 2.1.4 flag next to its new key, for one upgrade
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      global.streaming_ingestion.productEventsProcessor: true
      global.streaming_ingestion.consumers.productEvents.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses an unknown consumer
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      global.streaming_ingestion.consumers.walletAlert.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: 'global.streaming_ingestion.consumers.walletAlert is not an optional consumer; use one of: productEvents, usageAttribution, walletAlerts, walletRefresh'

  - it: refuses a switch on the always-on consumer
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      global.streaming_ingestion.consumers.eventsChargedInAdvance.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'global.streaming_ingestion.consumers.eventsChargedInAdvance is not an optional consumer; use one of: productEvents, usageAttribution, walletAlerts, walletRefresh'

  - it: refuses a consumer that is not a map
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      global.streaming_ingestion.consumers.walletAlerts: true
    asserts:
      - failedTemplate:
          errorMessage: 'global.streaming_ingestion.consumers.walletAlerts must be a map, for example {enabled: true}'

  - it: refuses a Karafka worker with no consumer
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      events-consumer-worker.karafka.consumer: ""
    asserts:
      - failedTemplate:
          errorMessage: 'events-consumer-worker.karafka.consumer must be "eventsChargedInAdvance" (got ""): it is the worker of that consumer'

  - it: refuses a consumer in a worker that is not its own
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      api.karafka.consumer: walletAlerts
    asserts:
      - failedTemplate:
          errorMessage: 'api.karafka.consumer "walletAlerts": that consumer runs in wallet-alerts-consumer-worker, one consumer per worker'
