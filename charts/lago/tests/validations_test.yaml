suite: Test the umbrella deploy-time guards in templates/validations.yaml. Helm's
  `condition` field cannot express two flags set together, so one loop over
  global.streaming_ingestion.consumers fails the render with a readable message
  instead of rolling out a pod that crash-loops. The deprecated flat flags count too.
templates:
  - templates/validations.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost

tests:
  - it: refuses the wallet refresh consumer when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.consumers.walletRefresh.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.walletRefresh requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: refuses the wallet alerts consumer when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.consumers.walletAlerts.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.walletAlerts requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: refuses the product events processor when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.consumers.productEvents.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.productEvents requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: refuses the deprecated walletRefreshConsumer when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.walletRefreshConsumer: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.walletRefresh requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: refuses the deprecated productEventsProcessor when streaming ingestion is off
    set:
      global.streaming_ingestion.enabled: false
      global.streaming_ingestion.productEventsProcessor: true
    asserts:
      - failedTemplate:
          errorMessage: "global.streaming_ingestion.consumers.productEvents requires global.streaming_ingestion.enabled: the consumer takes its Kafka connection and topics from the streaming ConfigMap/Secret, which is only rendered when streaming ingestion is on"

  - it: renders nothing once every consumer has streaming ingestion
    set:
      global.streaming_ingestion.enabled: true
      global.streaming_ingestion.kafka.bootstrapServers: [kafka:9092]
      global.streaming_ingestion.consumers.walletRefresh.enabled: true
      global.streaming_ingestion.consumers.walletAlerts.enabled: true
      global.streaming_ingestion.consumers.productEvents.enabled: true
    asserts:
      - hasDocuments:
          count: 0
