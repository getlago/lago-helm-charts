suite: Test that wallet-alerts-consumer-worker is not deployed with the default
  values (global.streaming_ingestion.walletAlertsConsumer is false). The subchart
  is then dropped by its Chart.yaml condition, so its own template cannot be
  selected. Render every Deployment instead and check that none is the consumer.
templates:
  - charts/*/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: does not render the deployment with default values
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-lago-wallet-alerts-consumer-worker
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the deployment once the toggle is on (guards the selector above)
    set:
      global.streaming_ingestion.walletAlertsConsumer: true
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-lago-wallet-alerts-consumer-worker
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 1
