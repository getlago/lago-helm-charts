suite: Test the optional mcp-server subchart
templates:
  - charts/mcp-server/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: https://api.test
      front: https://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    mcp:
      enabled: true
      endpoint: http://mcp.test/mcp
      clientId: test-agent-id
      clientSecret: test-api-key
  mcp-server.enabled: true

tests:
  - it: calls global.urls.api and reads the lago-config Secret
    release:
      name: demo
    asserts:
      - equal:
          path: metadata.name
          value: demo-lago-mcp-server
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_API_URL
            value: https://api.test/api/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MISTRAL_AGENT_ID
            valueFrom:
              secretKeyRef:
                name: demo-lago-config
                key: mcp.clientId
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MISTRAL_API_KEY
            valueFrom:
              secretKeyRef:
                name: demo-lago-config
                key: mcp.clientSecret

  - it: uses the lago-config name rule when the release is named lago
    release:
      name: lago
    asserts:
      - equal:
          path: metadata.name
          value: lago-mcp-server
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MISTRAL_AGENT_ID
            valueFrom:
              secretKeyRef:
                name: lago-config
                key: mcp.clientId

  - it: follows global.config.secret when the config Secret is external
    release:
      name: demo
    set:
      global.config.secret: demo-external-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MISTRAL_AGENT_ID
            valueFrom:
              secretKeyRef:
                name: demo-external-config
                key: mcp.clientId
