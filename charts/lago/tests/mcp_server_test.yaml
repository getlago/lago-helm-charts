suite: Test the optional mcp-server subchart
templates:
  - charts/mcp-server/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost

tests:
  - it: calls this release's api and reads this release's lago-config Secret
    release:
      name: demo
    set:
      mcp-server.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: demo-lago-mcp-server
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_API_URL
            value: http://demo-lago-api/api/v1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MISTRAL_AGENT_ID
            valueFrom:
              secretKeyRef:
                name: demo-lago-config
                key: mcp.clientId
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MISTRAL_API_KEY
            valueFrom:
              secretKeyRef:
                name: demo-lago-config
                key: mcp.clientSecret

  - it: follows global.config.secret when the config Secret is external
    release:
      name: demo
    set:
      mcp-server.enabled: true
      global.config.secret: demo-external-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MISTRAL_AGENT_ID
            valueFrom:
              secretKeyRef:
                name: demo-external-config
                key: mcp.clientId
