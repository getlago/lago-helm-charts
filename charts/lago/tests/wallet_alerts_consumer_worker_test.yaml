suite: Test wallet-alerts-consumer-worker subchart is gated by
  global.streaming_ingestion.walletAlertsConsumer and runs the Karafka server pinned
  to the wallet alerts consumer group. The topic comes from the streaming ConfigMap
  (covered in lago-config); the pairing with streaming ingestion is enforced in
  templates/validations.yaml and covered by validations_test.yaml.
templates:
  - charts/wallet-alerts-consumer-worker/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: renders the deployment with the Karafka server pinned to its consumer group when enabled
    set:
      global.streaming_ingestion.walletAlertsConsumer: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-wallet-alerts-consumer-worker
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["bundle", "exec", "karafka", "server", "--include_consumer_groups", "lago_wallet_alerts_consumer"]

  - it: attaches the streaming ConfigMap the wallet alerts topic comes from
    set:
      global.streaming_ingestion.walletAlertsConsumer: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-lago-config-streaming
