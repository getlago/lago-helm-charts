suite: Test wallet-alerts-consumer-worker subchart is gated by
  global.streaming_ingestion.walletAlertsConsumer and runs the Karafka entrypoint on
  the wallet alerts topic only, and events-consumer-worker does not consume that
  topic. The topic comes from the streaming ConfigMap (covered in lago-config); the
  pairing with streaming ingestion is enforced in templates/validations.yaml and
  covered by validations_test.yaml.
templates:
  - charts/wallet-alerts-consumer-worker/templates/deployment.yaml
  - charts/events-consumer-worker/templates/deployment.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    streaming_ingestion:
      enabled: true
      kafka:
        bootstrapServers:
          - kafka:9092

tests:
  - it: renders its own deployment with the Karafka entrypoint when enabled
    set:
      global.streaming_ingestion.walletAlertsConsumer: true
    asserts:
      - hasDocuments:
          count: 1
        template: charts/wallet-alerts-consumer-worker/templates/deployment.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-wallet-alerts-consumer-worker
        template: charts/wallet-alerts-consumer-worker/templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./scripts/start.events.consumer.sh"]
        template: charts/wallet-alerts-consumer-worker/templates/deployment.yaml

  - it: reads the wallet alerts topic and blanks the charged-in-advance topic
    set:
      global.streaming_ingestion.walletAlertsConsumer: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-lago-config-streaming
        template: charts/wallet-alerts-consumer-worker/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_EVENTS_CHARGED_IN_ADVANCE_TOPIC
            value: ""
        template: charts/wallet-alerts-consumer-worker/templates/deployment.yaml

  - it: blanks the wallet alerts topic on the events consumer
    set:
      global.streaming_ingestion.walletAlertsConsumer: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAGO_KAFKA_WALLET_ALERTS_TOPIC
            value: ""
        template: charts/events-consumer-worker/templates/deployment.yaml
