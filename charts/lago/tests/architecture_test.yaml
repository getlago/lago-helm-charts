suite: Test amd64 and arm64 API and worker deployments
templates:
  - charts/api/templates/deployment.yaml
  - charts/worker/templates/deployment.yaml
  - charts/api/templates/service.yaml

set:
  global:
    lago:
      env: production
      version: v1.0.0
    urls:
      api: http://api.test
      front: http://front.test
    database:
      uri: postgresql://localhost
    encryption:
      key: test-key
      salt: test-salt
    signing:
      hmac: test-hmac
      rsa: test-rsa
    redis:
      uri: redis://localhost
    redisCache:
      uri: redis://localhost
    redisStore:
      uri: redis://localhost
    architectures:
      amd64:
        enabled: true
      arm64:
        enabled: true
  api:
    replicaCount: 5
    image:
      repository: example.test/lago-api
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
    architectures:
      amd64:
        replicaCount: 4
      arm64:
        replicaCount: 1
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: arch
            operator: Equal
            value: arm64
            effect: NoSchedule
  worker:
    replicaCount: 5
    image:
      repository: example.test/lago-worker
    resources:
      requests:
        cpu: 1
        memory: 1Gi
    architectures:
      amd64:
        replicaCount: 3
      arm64:
        replicaCount: 2
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: arch
            operator: Equal
            value: arm64
            effect: NoSchedule

tests:
  - it: leaves the amd64 API deployment unchanged except for its configured replica count
    template: charts/api/templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-api
      - equal:
          path: spec.replicas
          value: 4
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.test/lago-api:v1.0.0
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./scripts/start.api.sh"]
      - equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: 500m
            memory: 512Mi
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations

  - it: renders the arm64 API from the same workload values
    template: charts/api/templates/deployment.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-api-arm64
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.test/lago-api:v1.0.0
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./scripts/start.api.sh"]
      - equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: 500m
            memory: 512Mi
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/arch: arm64
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: arch
            operator: Equal
            value: arm64
            effect: NoSchedule

  - it: leaves the amd64 worker deployment unchanged except for its configured replica count
    template: charts/worker/templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-worker
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.test/lago-worker:v1.0.0
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./scripts/start.worker.sh"]
      - equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: 1
            memory: 1Gi
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations

  - it: renders the arm64 worker from the same workload values
    template: charts/worker/templates/deployment.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-worker-arm64
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.test/lago-worker:v1.0.0
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["./scripts/start.worker.sh"]
      - equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: 1
            memory: 1Gi
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/arch: arm64
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: arch
            operator: Equal
            value: arm64
            effect: NoSchedule

  - it: renders only the amd64 API when arm64 is globally disabled
    template: charts/api/templates/deployment.yaml
    set:
      global:
        architectures:
          arm64:
            enabled: false
    asserts:
      - hasDocuments:
          count: 1

  - it: keeps a separate name in each deployment selector
    template: charts/api/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: lago-api
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 0
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: lago-api-arm64
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 1

  - it: gives the pods of both architectures the same component label
    template: charts/api/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: lago-api
        documentIndex: 0
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: lago-api
        documentIndex: 1

  - it: renders one API service that selects the component when arm64 is on
    template: charts/api/templates/service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: lago-api

  - it: keeps the original API service selector when arm64 is off
    template: charts/api/templates/service.yaml
    set:
      global:
        architectures:
          arm64:
            enabled: false
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: lago-api
            app.kubernetes.io/instance: RELEASE-NAME

  - it: renders an arm64 worker without replicas when KEDA controls it
    template: charts/worker/templates/deployment.yaml
    set:
      worker:
        architectures:
          arm64:
            replicaCount: 0
            autoscaling:
              enabled: true
              external: true
              minReplicas: 2
              maxReplicas: 8
              targetCPUUtilizationPercentage: 80
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lago-worker-arm64
      - notExists:
          path: spec.replicas
