# Global values shared across all subcharts (api, worker, clock, config)
global:
  lago:
    env: "production"
    license: ""
    signup: false
    cloud: false
    sidekiqPro: false
    pdfGeneration: false

  urls:
    api: ""
    front: ""
    pdf: ""

  database:
    uri: ""
    pool: 20

  encryption:
    key: "" # ENCRYPTION_PRIMARY_KEY
    salt: "" # ENCRYPTION_KEY_DERIVATION_SALT

  signing:
    hmac: "" # SECRET_KEY_BASE used by webhooks, message verifier HS256
    rsa: ""  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

  redis:
    url: ""
    password: ""

  redisCache:
    url: ""
    password: ""

  redisStore:
    url: ""
    password: ""

  sentryDsn: ""
  segmentWriteKey: ""

  s3:
    enabled: false
    accessKeyId: ""
    secretAccessKey: ""
    bucket: ""
    region: ""
    endpoint: ""
    # s3.pathStyle -- (boolean)
    pathStyle:

  smtp:
    enabled: false
    username: ""
    password: ""
    from: ""
    port: 25
    address: ""

  google:
    enabled: false
    clientId:
    clientSecret:

  gocardless:
    enabled: false
    clientId:
    clientSecret:
    proxy:

config:
  configMap:
    name: lago-config
  secret:
    name: lago-config

# lago-api subchart settings
api:
  config:
    enabled: false
    web:
      sidekiq: true
    configMap:
      name: lago-config
    secret:
      name: lago-config

  nameOverride: lago-api

front:
  config:
    enabled: false
    configMap:
      name: lago-config
    secret:
      name: lago-config
  nameOverride: lago-front

# worker:
#   nameOverride: lago-worker
#   service:
#     enabled: false

# clock:
#   nameOverride: lago-clock
#   service:
#     enabled: false
