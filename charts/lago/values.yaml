# -- PDF stack subchart overrides (lago-pdf, conditional on `global.sidekiq.queues.pdf`)
pdf:
  # -- Override the PDF subchart release name
  nameOverride: lago-pdf
  config:
    # -- Disable nested config (uses parent config subchart)
    enabled: false
    # -- Config subchart name override
    nameOverride: lago-config

  worker:
    config:
      # -- Config subchart name override for PDF worker
      nameOverride: lago-config

# -- Events consumer worker subchart overrides (lago-rails, conditional on `global.streaming_ingestion.enabled`)
events-consumer-worker:
  # -- Override the events-consumer-worker subchart release name
  nameOverride: lago-events-consumer-worker
  config:
    # -- Disable nested config (uses parent config subchart)
    enabled: false
