# Global values shared across all subcharts (api, worker, clock, config)
global:
  lago:
    version: ""
    env: "production"
    license: ""
    signup: false
    cloud: false
    pdfGeneration: false

  sidekiq:
    pro: false
    queues:
      analytics: false
      billing: false
      clock: false
      events: false
      webhook: false
      pdf: false

  config:
    configmap:
    secret:

  urls:
    api: ""
    front: ""
    pdf: ""

  database:
    uri: ""
    pool: 20

  encryption:
    key: "" # ENCRYPTION_PRIMARY_KEY
    salt: "" # ENCRYPTION_KEY_DERIVATION_SALT

  signing:
    hmac: "" # SECRET_KEY_BASE used by webhooks, message verifier HS256
    rsa: ""  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

  redis:
    uri: ""
    password: ""

  redisCache:
    uri: ""
    password: ""

  redisStore:
    uri: ""
    password: ""

  sentryDsn: ""
  segmentWriteKey: ""

  nango:
    publicKey: ""
    secretKey: ""

  s3:
    enabled: false
    accessKeyId: ""
    secretAccessKey: ""
    bucket: ""
    region: "us-east-1"
    endpoint: ""
    # s3.pathStyle -- (boolean)
    pathStyle:

  smtp:
    enabled: false
    username: ""
    password: ""
    from: ""
    port: 25
    address: ""

  google:
    enabled: false
    clientId:
    clientSecret:

  gocardless:
    enabled: false
    clientId:
    clientSecret:
    proxy:

  mcp:
    enabled: false
    clientId:
    clientSecret:
    endpoint:

  data:
    enabled: false
    token:
    endpoint:

  streaming_ingestion:
    enabled: false
    configmap: ""
    secret: ""

    clickhouse:
      # username and password are not required here if using an external secret:
      #  config.enabled: false, config.secret.name: "..."
      username: ""
      password: ""
      port: 9000
      address: clickhouse
      tls: false
      database: default

    # kafka is required if clickhouse is set
    kafka:
      # username and password are not required here if if using an external secret:
      #  config.enabled: false, config.secret.name: "..."
      username: ""
      password: ""
      tls: false
      # SCRAM-SHA-512, SCRAM-SHA-256
      saslMechanisms:
      consumerGroup: events_consumer
      # you must provide a list of Kafka servers if clickhouse is enabled
      bootstrapServers: []
      #   - "kafka-server:9092"
      topics:
        eventsChargedInAdvance: events_charged_in_advance
        eventsDeadLetter: events_dead_letter
        eventsEnriched: events_enriched
        eventsEnrichedExpanded: events_enriched_expanded
        eventsRaw: events_raw
        activityLogs: activity_logs
        apiLogs: api_logs

config:
  nameOverride: lago-config

# lago-api subchart settings
api:
  config:
    enabled: false
    nameOverride: lago-config
    web:
      sidekiq: true

  nameOverride: lago-api

front:
  config:
    enabled: false

  nameOverride: lago-front

worker:
  nameOverride: lago-worker
  config:
    enabled: false
    nameOverride: lago-config

  service:
    enabled: false

  livenessProbe: null
  readinessProbe: null

  container:
    command: ["./scripts/start.worker.sh"]
    ports:


