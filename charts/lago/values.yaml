# -- Database migration job configuration
# @section -- Database Migration
migrate:
  # -- Enable the database migration job
  # @section -- Database Migration
  enabled: false
  image:
    # -- Migration job image repository
    # @section -- Database Migration
    repository: getlago/api
    # -- Override the migration job image tag
    # @section -- Database Migration
    tag: ""
    # -- Image pull policy
    # @section -- Database Migration
    pullPolicy: IfNotPresent
  # -- Command to run for migrations
  # @section -- Database Migration
  command: ["./scripts/migrate.sh"]
  # -- Arguments for the migration command
  # @section -- Database Migration
  args: []
  # -- Helm hook weight (lower runs first)
  # @section -- Database Migration
  hookWeight: "-5"
  # -- Hook delete policy (`hook-succeeded`, `hook-failed`, `before-hook-creation`)
  # @section -- Database Migration
  hookDeletePolicy: before-hook-creation
  # -- Job backoff limit
  # @section -- Database Migration
  backoffLimit: 3
  # -- Restart policy for the job pod
  # @section -- Database Migration
  restartPolicy: Never
  # -- TTL for cleaning up finished jobs (seconds)
  # @section -- Database Migration
  ttlSecondsAfterFinished: 300
  # -- Active deadline for the job (seconds)
  # @section -- Database Migration
  activeDeadlineSeconds: 600
  # -- Additional annotations for the Job
  # @section -- Database Migration
  annotations: {}
  # -- Additional annotations for the pod
  # @section -- Database Migration
  podAnnotations: {}
  # -- Additional labels for the pod
  # @section -- Database Migration
  podLabels: {}
  # -- Service account name for the job
  # @section -- Database Migration
  serviceAccountName: ""
  # -- Image pull secrets
  # @section -- Database Migration
  imagePullSecrets: []
  # -- Pod security context
  # @section -- Database Migration
  podSecurityContext: {}
  # -- Container security context
  # @section -- Database Migration
  securityContext: {}
  # -- Resource requests and limits
  # @section -- Database Migration
  resources: {}
  # -- Extra environment variables (map format, deep-mergeable)
  # @section -- Database Migration
  extraEnv: {}
  # -- Extra envFrom sources
  # @section -- Database Migration
  extraEnvFrom: []
  # -- Additional volumes
  # @section -- Database Migration
  volumes: []
  # -- Additional volume mounts
  # @section -- Database Migration
  volumeMounts: []
  # -- Node selector constraints
  # @section -- Database Migration
  nodeSelector: {}
  # -- Pod tolerations
  # @section -- Database Migration
  tolerations: []
  # -- Pod affinity rules
  # @section -- Database Migration
  affinity: {}

