# -- Events processor worker subchart overrides (conditional on `global.streaming_ingestion.enabled`)
events-processor-worker:
  # -- Override the events-processor-worker subchart release name
  nameOverride: lago-events-processor-worker
  config:
    # -- Disable nested config (uses parent config subchart)
    enabled: false
    # -- Config subchart name override
    nameOverride: lago-config

# -- Database migration job configuration
migrate:
  # -- Enable the database migration job
  enabled: false
  image:
    # -- Migration job image repository
    repository: getlago/api
    # -- Override the migration job image tag
    tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Command to run for migrations
  command: ["./scripts/migrate.sh"]
  # -- Arguments for the migration command
  args: []
  # -- Helm hook weight (lower runs first)
  hookWeight: "-5"
  # -- Hook delete policy (`hook-succeeded`, `hook-failed`, `before-hook-creation`)
  hookDeletePolicy: before-hook-creation
  # -- Job backoff limit
  backoffLimit: 3
  # -- Restart policy for the job pod
  restartPolicy: Never
  # -- TTL for cleaning up finished jobs (seconds)
  ttlSecondsAfterFinished: 300
  # -- Active deadline for the job (seconds)
  activeDeadlineSeconds: 600
  # -- Additional annotations for the Job
  annotations: {}
  # -- Additional annotations for the pod
  podAnnotations: {}
  # -- Additional labels for the pod
  podLabels: {}
  # -- Service account name for the job
  serviceAccountName: ""
  # -- Image pull secrets
  imagePullSecrets: []
  # -- Pod security context
  podSecurityContext: {}
  # -- Container security context
  securityContext: {}
  # -- Resource requests and limits
  resources: {}
  # -- Extra environment variables (map format, deep-mergeable)
  extraEnv: {}
  # -- Extra envFrom sources
  extraEnvFrom: []
  # -- Additional volumes
  volumes: []
  # -- Additional volume mounts
  volumeMounts: []
  # -- Node selector constraints
  nodeSelector: {}
  # -- Pod tolerations
  tolerations: []
  # -- Pod affinity rules
  affinity: {}

# -- Kafka topic creation job configuration
createTopics:
  # -- Enable the Kafka topic creation job
  enabled: false
  image:
    # -- Topic job image repository
    repository: alpine
    # -- Topic job image tag
    tag: "3.20"
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Helm hook weight (lower runs first)
  hookWeight: "-1"
  # -- Hook delete policy (`hook-succeeded`, `hook-failed`, `before-hook-creation`)
  hookDeletePolicy: before-hook-creation
  # -- Job backoff limit
  backoffLimit: 3
  # -- Restart policy for the job pod
  restartPolicy: Never
  # -- TTL for cleaning up finished jobs (seconds)
  ttlSecondsAfterFinished: 300
  # -- Active deadline for the job (seconds)
  activeDeadlineSeconds: 300
  # -- Additional annotations for the Job
  annotations: {}
  # -- Additional annotations for the pod
  podAnnotations: {}
  # -- Additional labels for the pod
  podLabels: {}
  # -- Service account name for the job
  serviceAccountName: ""
  # -- Image pull secrets
  imagePullSecrets: []
  # -- Pod security context
  podSecurityContext: {}
  # -- Container security context
  securityContext: {}
  # -- Resource requests and limits
  resources: {}
  # -- Extra environment variables (map format, deep-mergeable)
  extraEnv: {}
  # -- Node selector constraints
  nodeSelector: {}
  # -- Pod tolerations
  tolerations: []
  # -- Pod affinity rules
  affinity: {}

# -- Kafka topic deletion job configuration
deleteTopics:
  # -- Enable the Kafka topic deletion job
  enabled: false
  image:
    # -- Topic job image repository
    repository: alpine
    # -- Topic job image tag
    tag: "3.20"
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Helm hook weight (lower runs first)
  hookWeight: "1"
  # -- Hook delete policy (`hook-succeeded`, `hook-failed`, `before-hook-creation`)
  hookDeletePolicy: before-hook-creation
  # -- Job backoff limit
  backoffLimit: 3
  # -- Restart policy for the job pod
  restartPolicy: Never
  # -- TTL for cleaning up finished jobs (seconds)
  ttlSecondsAfterFinished: 300
  # -- Active deadline for the job (seconds)
  activeDeadlineSeconds: 300
  # -- Additional annotations for the Job
  annotations: {}
  # -- Additional annotations for the pod
  podAnnotations: {}
  # -- Additional labels for the pod
  podLabels: {}
  # -- Service account name for the job
  serviceAccountName: ""
  # -- Image pull secrets
  imagePullSecrets: []
  # -- Pod security context
  podSecurityContext: {}
  # -- Container security context
  securityContext: {}
  # -- Resource requests and limits
  resources: {}
  # -- Extra environment variables (map format, deep-mergeable)
  extraEnv: {}
  # -- Node selector constraints
  nodeSelector: {}
  # -- Pod tolerations
  tolerations: []
  # -- Pod affinity rules
  affinity: {}

# -- Array of extra K8s manifests to deploy
extraObjects: []
