# Deploys the PDF stack with a worker and a gotenberg deployment
pdf:
  nameOverride: lago-pdf
  config:
    enabled: false
    nameOverride: lago-config

  worker:
    config:
      nameOverride: lago-config

events-consumer-worker:
  nameOverride: lago-events-consumer-worker
  config:
    enabled: false
    nameOverride: lago-config
  livenessProbe: null
  readinessProbe: null
  service:
    enabled: false
