# Global values shared across all subcharts (api, worker, clock, config)
global:
  lago:
    env: "production"
    license: ""
    signup: false
    cloud: false
    sidekiqPro: false
    pdfGeneration: false

  config:
    configmap:
    secret:

  urls:
    api: ""
    front: ""
    pdf: ""

  database:
    uri: ""
    pool: 20

  encryption:
    key: "" # ENCRYPTION_PRIMARY_KEY
    salt: "" # ENCRYPTION_KEY_DERIVATION_SALT

  signing:
    hmac: "" # SECRET_KEY_BASE used by webhooks, message verifier HS256
    rsa: ""  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

  redis:
    url: ""
    password: ""

  redisCache:
    url: ""
    password: ""

  redisStore:
    url: ""
    password: ""

  sentryDsn: ""
  segmentWriteKey: ""

  s3:
    enabled: false
    accessKeyId: ""
    secretAccessKey: ""
    bucket: ""
    region: ""
    endpoint: ""
    # s3.pathStyle -- (boolean)
    pathStyle:

  smtp:
    enabled: false
    username: ""
    password: ""
    from: ""
    port: 25
    address: ""

  google:
    enabled: false
    clientId:
    clientSecret:

  gocardless:
    enabled: false
    clientId:
    clientSecret:
    proxy:

  mcp:
    enabled: false
    clientId:
    clientSecret:
    endpoint:

  data:
    enabled: false
    token:
    endpoint:

  streaming_ingestion:
    enabled: false
    configmap: ""
    secret: ""

    clickhouse:
      # username and password are not required here if using an external secret:
      #  config.enabled: false, config.secret.name: "..."
      username: ""
      password: ""
      port: 9000
      address: clickhouse
      tls: true

    # kafka is required if clickhouse is set
    kafka:
      # username and password are not required here if if using an external secret:
      #  config.enabled: false, config.secret.name: "..."
      username: ""
      password: ""
      tls: true
      saslMechanisms: SCRAM-SHA-512
      securityProtocol: SASL_SSL
      consumerGroup: events_consumer
      # you must provide a list of Kafka servers if clickhouse is enabled
      bootstrapServers: []
      #   - "kafka-server:9092"
      topics:
        eventsChargedInAdvance: events_charged_in_advance
        eventsDeadLetter: events_dead_letter
        eventsEnriched: events_enriched
        eventsEnrichedExpanded: events_enriched_expanded
        eventsRaw: events_raw
        activityLogs: activity_logs
        apiLogs: api_logs

config:
  configMap:
    name: lago-config
  secret:
    name: lago-config

# lago-api subchart settings
api:
  config:
    enabled: false
    web:
      sidekiq: true
    configMap:
      name: lago-config
    secret:
      name: lago-config

  nameOverride: lago-api

front:
  config:
    enabled: false
    configMap:
      name: lago-config
    secret:
      name: lago-config
  nameOverride: lago-front

# Database migration job configuration
migrate:
  # -- Enable the database migration job
  enabled: false
  image:
    repository: getlago/api
    tag: ""
    pullPolicy: IfNotPresent
  # -- Command to run for migrations
  command: []
  # -- Arguments for the migration command
  args: []
  # -- Helm hook weight (lower runs first)
  hookWeight: "-5"
  # -- Hook delete policy: hook-succeeded, hook-failed, before-hook-creation
  hookDeletePolicy: before-hook-creation
  # -- Job backoff limit
  backoffLimit: 3
  # -- Restart policy for the job pod
  restartPolicy: Never
  # -- TTL for cleaning up finished jobs (seconds)
  ttlSecondsAfterFinished: 300
  # -- Active deadline for the job (seconds)
  activeDeadlineSeconds: 600
  # -- Additional annotations for the Job
  annotations: {}
  # -- Additional annotations for the pod
  podAnnotations: {}
  # -- Additional labels for the pod
  podLabels: {}
  # -- Service account name for the job
  serviceAccountName: ""
  # -- Image pull secrets
  imagePullSecrets: []
  # -- Pod security context
  podSecurityContext: {}
  # -- Container security context
  securityContext: {}
  # -- Resource limits and requests
  resources: {}
  # -- Additional environment variables
  extraEnv: []
  # -- Additional envFrom sources
  extraEnvFrom: []
  # -- Additional volumes
  volumes: []
  # -- Additional volume mounts
  volumeMounts: []
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity
  affinity: {}


worker:
  nameOverride: lago-worker
  config:
    enabled: false
    configMap:
      name: lago-config
    secret:
      name: lago-config

  service:
    enabled: false

  livenessProbe: null
  readinessProbe: null

  container:
    command: ["./scripts/start.worker.sh"]


clock:
  nameOverride: lago-clock
  config:
    enabled: false
    configMap:
      name: lago-config
    secret:
      name: lago-config
  livenessProbe: null
  readinessProbe: null
  service:
    enabled: false
  container:
    command: ["./scripts/start.clock.sh"]

