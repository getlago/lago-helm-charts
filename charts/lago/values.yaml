# Global values shared across all subcharts (api, worker, clock, config)
global:
  lago:
    cloud: true
    sidekiqPro: true

  urls:
    api: "max-test-api.staging.getlago.com"
    front: "max-test-app.staging.getlago.com"
    pdf: "http://pdf-web.default.svc.cluster.local"

  database:
    uri: ""

  encryption:
    key: "" # ENCRYPTION_PRIMARY_KEY
    salt: "" # ENCRYPTION_KEY_DERIVATION_SALT

  signing:
    hmac: "" # SECRET_KEY_BASE used by webhooks, message verifier HS256
    rsa: ""  # LAGO_RSA_PRIVATE_KEY used by webhooks RS256

  redis:
    url: "redis://max-test-redis.default.svc.cluster.local:6379"
    password: ""

  redisCache:
    url: "redis://max-test-redis.default.svc.cluster.local:6379"
    password: ""

  redisStore:
    url: "redis://max-test-redis.default.svc.cluster.local:6379"
    password: ""

  s3:
    enabled: true
    accessKeyId: ""
    secretAccessKey: ""
    bucket: "lago-staging"

# lago-config subchart settings
config:
  configMap:
    name: lago-config
  secret:
    name: lago-config

# lago-api subchart settings
api:
  config:
    enabled: false
    env: development
    web:
      sidekiq: true
    configMap:
      name: lago-config
    secret:
      name: lago-config

  nameOverride: lago-api

