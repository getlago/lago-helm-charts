# Default values for lago-data-worker.

global:
  databaseAnalytical:
    # -- Analytical database host
    host: ""
    # -- Analytical database name
    name: ""
    # -- Analytical database user
    user: ""
    # -- Analytical database password
    password: ""
    # -- Analytical database port
    port: 5432
    # -- Analytical database schema
    schema: analytical

  forecastedUsage:
    # -- Enable forecasted usage feature (defaults to true when data-worker is deployed)
    enabled: true
    # -- Lago API token for forecasted usage calls
    api_token:
    celery:
      # -- Celery broker URL
      brokerUrl: ""
      # -- Celery result backend URL
      resultBackend: ""

  dbtPipeline:
    # -- Enable dbt pipeline
    enabled: false
    # -- Source schema for dbt pipeline
    sourceSchema: public
    # -- Target schema for dbt pipeline
    targetSchema: analytical
    # -- Tables to replicate
    tables: []

  databaseReplica:
    # -- Replica database host
    host: ""
    # -- Replica database name
    name: ""
    # -- Replica database user
    user: ""
    # -- Replica database password
    password: ""
    # -- Replica database port
    port: 5432

  data:
    # -- Name of an existing ConfigMap for data configuration
    configmap:
    # -- Name of an existing Secret for data configuration
    secret:
    # -- API token to validate calls from lago-api
    token:

config:
  # -- Deploy the data-config subchart
  enabled: false
  api:
    # -- Lago API URL for the data worker
    url: ""

# -- Number of replicas (ignored when autoscaling is enabled)
replicaCount: 1

image:
  # -- Container image repository
  repository: getlago/data-worker
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Override the image tag (defaults to Chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
# @default -- `[]`
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

container:
  # -- Override the container name (defaults to chart fullname)
  name: ""
  # -- Container entrypoint command
  command: ["uv"]
  # -- Container command arguments
  args: ["run", "python", "worker/start_worker.py"]

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Automount the ServiceAccount API credentials
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- ServiceAccount name (generated from fullname if not set)
  name: ""

# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}

# -- Container-level security context
securityContext: {}

# -- Resource requests and limits
resources: {}

# -- Extra environment variables (map format, deep-mergeable)
extraEnv: {}

# -- Extra envFrom sources
# @default -- `[]` (See [values.yaml])
extraEnvFrom: []

# -- Liveness probe configuration
livenessProbe: {}

autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  # -- Set to true when using an external autoscaler (e.g. KEDA) to skip built-in HPA
  external: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 100
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80

# -- Additional volumes
volumes: []

# -- Additional volume mounts
volumeMounts: []

# -- Node selector constraints
nodeSelector: {}

# -- Pod tolerations
tolerations: []

# -- Pod affinity rules
affinity: {}
