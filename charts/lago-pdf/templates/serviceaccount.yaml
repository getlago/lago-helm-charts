{{- if .Values.gotenberg.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lago-pdf.serviceAccountName" . }}
  labels:
    {{- include "lago-pdf.labels" . | nindent 4 }}
  {{- with .Values.gotenberg.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.gotenberg.serviceAccount.automount }}
{{- end }}
