suite: Test the data-api container command
templates:
  - templates/deployment.yaml
values:
  - fixtures/required.yaml

tests:
  - it: should leave command and args to the image by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command
      - notExists:
          path: spec.template.spec.containers[0].args

  - it: should leave command and args to the image when they are null
    set:
      container.command: null
      container.args: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command
      - notExists:
          path: spec.template.spec.containers[0].args

  - it: should render command and args when they are set
    set:
      container.command: ["uv"]
      container.args: ["run", "fastapi", "run", "app/main.py", "--port", "80"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["uv"]
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["run", "fastapi", "run", "app/main.py", "--port", "80"]
