suite: Test the data-api container command
templates:
  - templates/deployment.yaml
values:
  - fixtures/required.yaml

tests:
  - it: should render the deprecated Debian-image command by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["uv"]
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["run", "fastapi", "run", "app/main.py", "--port", "80"]

  - it: should leave command and args to the image when they are empty
    set:
      container.command: []
      container.args: []
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command
      - notExists:
          path: spec.template.spec.containers[0].args

  - it: should leave command and args to the image when they are null
    set:
      container.command: null
      container.args: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command
      - notExists:
          path: spec.template.spec.containers[0].args

  # Kubernetes keeps the image ENTRYPOINT and replaces its CMD with args: an
  # override must set both keys (see values.yaml).
  - it: should render args alone when only args are set
    set:
      container.command: []
      container.args: ["run", "app/main.py", "--workers", "2"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["run", "app/main.py", "--workers", "2"]
