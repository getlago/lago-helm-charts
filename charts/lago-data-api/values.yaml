# Default values for lago-data-api.

global:
  databaseAnalytical:
    # -- Analytical database host
    host: ""
    # -- Analytical database name
    name: ""
    # -- Analytical database user
    user: ""
    # -- Analytical database password
    password: ""
    # -- Analytical database port
    port: 5432
    # -- Analytical database schema
    schema: analytical

  forecastedUsage:
    # -- Enable forecasted usage feature
    enabled: false
    # -- Lago API token for forecasted usage calls
    api_token:
    celery:
      # -- Celery broker URL
      brokerUrl: ""
      # -- Celery result backend URL
      resultBackend: ""

  data:
    # -- Name of an existing ConfigMap for data configuration
    configmap:
    # -- Name of an existing Secret for data configuration
    secret:
    # -- API token to validate calls from lago-api
    token:

config:
  # -- Deploy the data-config subchart
  enabled: true

# -- Number of replicas (ignored when autoscaling is enabled)
replicaCount: 1

image:
  # -- Container image repository
  repository: getlago/data-api
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Override the image tag (defaults to Chart appVersion)
  tag:

# -- Image pull secrets for private registries
# @default -- `[]`
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

container:
  # -- Override the container name (defaults to chart fullname)
  name: ""
  # -- Container entrypoint command
  command: ["uv"]
  # -- Container command arguments
  args: ["run", "fastapi", "run", "app/main.py", "--port", "80"]
  ports:
    # -- HTTP container port
    http: 80

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Automount the ServiceAccount API credentials
  automount: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- ServiceAccount name (generated from fullname if not set)
  name: ""

# -- Additional pod annotations
podAnnotations: {}
# -- Additional pod labels
podLabels: {}

# -- Pod-level security context
podSecurityContext: {}

# -- Container-level security context
securityContext: {}

# -- Extra environment variables (map format, deep-mergeable)
extraEnv: {}

# -- Extra envFrom sources
# @default -- `[]` (See [values.yaml])
extraEnvFrom: []

service:
  # -- Service type (`ClusterIP`, `NodePort`, `LoadBalancer`)
  type: ClusterIP
  # -- Service port
  port: 80

ingress:
  # -- Enable Ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress host rules
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration
  tls: []

# -- Expose the service via Gateway API HTTPRoute
httpRoute:
  # -- Enable HTTPRoute
  enabled: false
  # -- HTTPRoute annotations
  annotations: {}
  # -- Parent gateway references
  parentRefs:
  - name: gateway
    sectionName: http
  # -- Hostnames to match
  hostnames:
  - chart-example.local
  # -- Routing rules and filters
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

# -- Resource requests and limits
resources: {}

# -- Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  successThreshold: 1
  timeoutSeconds: 1
# -- Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 3
  successThreshold: 1
  timeoutSeconds: 1

autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  # -- Set to true when using an external autoscaler (e.g. KEDA) to skip built-in HPA
  external: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 100
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80

# -- Additional volumes
volumes: []

# -- Additional volume mounts
volumeMounts: []

# -- Node selector constraints
nodeSelector: {}

# -- Pod tolerations
tolerations: []

# -- Pod affinity rules
affinity: {}

# -- Array of extra K8s manifests to deploy
extraObjects: []
