apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lago-data-api.fullname" . }}
  labels:
    {{- include "lago-data-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lago-data-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lago-data-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lago-data-api.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ default .Chart.Name .Values.name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: ANALYTICAL_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lago-data-api.configMapName" . }}
                  key: db.analytical.host
            - name: ANALYTICAL_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lago-data-api.configMapName" . }}
                  key: db.analytical.name
            - name: ANALYTICAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lago-data-api.secretName" . }}
                  key: analytical.db.password
            - name: ANALYTICAL_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lago-data-api.configMapName" . }}
                  key: db.analytical.port
            - name: ANALYTICAL_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lago-data-api.configMapName" . }}
                  key: db.analytical.schema
            - name: ANALYTICAL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lago-data-api.secretName" . }}
                  key: analytical.db.username
            - name: BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lago-data-api.secretName" . }}
                  key: token
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lago-data-api.configMapName" . }}
                  key: celery.broker
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lago-data-api.configMapName" . }}
                  key: celery.result_backend
            - name: LAGO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lago-data-api.secretName" . }}
                  key: lago.api.token
            - name: LAGO_RAILS_API
              valueFrom:
                configMapKeyRef:
                  name: {{ include "lago-data-api.configMapName" . }}
                  key: lago.api
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
