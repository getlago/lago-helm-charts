{{- if .Values.config.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lago-data-api.secretName" . }}
  labels:
    {{- include "lago-data-api.labels" . | nindent 4 }}
    {{- with .Values.config.secret.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.config.secret.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
stringData:
  {{- include "lago-data-api.config.secret" . | trim | nindent 2 }}
{{- end }}
