{{- if .Values.config.cm.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lago-data-api.configMapName" . }}
  labels:
    {{- include "lago-data-api.labels" . | nindent 4 }}
    {{- with .Values.config.cm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.config.cm.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  {{- include "lago-data-api.config.cm" . | trim | nindent 2 }}
{{- end }}
