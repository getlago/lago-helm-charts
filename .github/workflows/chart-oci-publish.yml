name: Publish charts to GHCR (OCI)

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: oci://ghcr.io/getlago/helm-charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Validate tag matches chart versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG"
          MISMATCH=0
          for chart in charts/*/Chart.yaml; do
            CHART_NAME=$(basename "$(dirname "$chart")")
            VERSION=$(grep '^version:' "$chart" | awk '{print $2}')
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::$CHART_NAME version ($VERSION) does not match tag (v$TAG)"
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" -eq 1 ]; then
            exit 1
          fi
          echo "All chart versions match tag v$TAG"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish all charts
        run: |
          # Ordered so base charts are published before dependents
          CHARTS=(
            lago-config
            lago-data-config
            lago-rails
            lago-front
            lago-events-processor-worker
            lago-data-api
            lago-data-worker
            lago-data-forecasted-usage
            lago-mcp-server
            lago-pdf
            lago-data
            lago
            lago-staging
          )

          mkdir -p .helm-packages .helm-build

          for chart in "${CHARTS[@]}"; do
            echo "::group::Publishing $chart"

            VERSION=$(grep '^version:' "charts/$chart/Chart.yaml" | awk '{print $2}')

            rm -rf ".helm-build/$chart"
            cp -r "charts/$chart" .helm-build/

            # Transform file:// dependencies to OCI registry
            sed -i 's|repository:.*"file://\.\./[^"]*"|repository: "'"$REGISTRY"'"|g' ".helm-build/$chart/Chart.yaml"
            rm -f ".helm-build/$chart/Chart.lock"

            helm dependency update ".helm-build/$chart"
            helm package ".helm-build/$chart" --destination .helm-packages
            helm push ".helm-packages/$chart-$VERSION.tgz" "$REGISTRY"

            echo "Published $chart:$VERSION"
            echo "::endgroup::"
          done

          rm -rf .helm-packages .helm-build
