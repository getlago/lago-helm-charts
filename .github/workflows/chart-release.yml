name: Release charts

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver without v prefix, e.g. 0.4.0)'
        required: true
        type: string

env:
  REGISTRY: oci://ghcr.io/getlago/helm-charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver format: ${{ inputs.version }}"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Bump chart versions
        run: |
          OLD_VERSION=$(grep '^version:' charts/lago/Chart.yaml | awk '{print $2}')
          NEW_VERSION="${{ inputs.version }}"

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Charts already at version $NEW_VERSION, skipping bump"
            exit 0
          fi

          echo "Bumping chart versions: $OLD_VERSION -> $NEW_VERSION"
          find charts -name Chart.yaml -exec sed -i "s/version: $OLD_VERSION/version: $NEW_VERSION/g" {} +

      - name: Update chart dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "$chart/Chart.lock" ] || grep -q 'dependencies:' "$chart/Chart.yaml" 2>/dev/null; then
              rm -f "$chart/Chart.lock"
              helm dependency update "$chart"
            fi
          done

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add charts/
            git commit -m "chore: bump chart versions to ${{ inputs.version }}"
            git push
          fi

          git tag -fa "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push --force origin "v${{ inputs.version }}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version }}" &>/dev/null; then
            gh release delete "v${{ inputs.version }}" --yes
          fi
          gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish all charts to GHCR
        run: |
          # Ordered so base charts are published before dependents
          CHARTS=(
            lago-config
            lago-data-config
            lago-rails
            lago-front
            lago-events-processor-worker
            lago-data-api
            lago-data-worker
            lago-data-forecasted-usage
            lago-mcp-server
            lago-pdf
            lago-data
            lago
            lago-staging
          )

          mkdir -p .helm-packages .helm-build

          for chart in "${CHARTS[@]}"; do
            echo "::group::Publishing $chart"

            VERSION=$(grep '^version:' "charts/$chart/Chart.yaml" | awk '{print $2}')

            rm -rf ".helm-build/$chart"
            cp -r "charts/$chart" .helm-build/

            # Transform file:// dependencies to OCI registry
            sed -i 's|repository:.*"file://\.\./[^"]*"|repository: "'"$REGISTRY"'"|g' ".helm-build/$chart/Chart.yaml"
            rm -f ".helm-build/$chart/Chart.lock"

            helm dependency update ".helm-build/$chart"
            helm package ".helm-build/$chart" --destination .helm-packages
            helm push ".helm-packages/$chart-$VERSION.tgz" "$REGISTRY"

            echo "Published $chart:$VERSION"
            echo "::endgroup::"
          done

          rm -rf .helm-packages .helm-build

      - name: Add OCI links to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_URL: https://github.com/orgs/getlago/packages/container/helm-charts%2F
        run: |
          CHARTS=(
            lago-config lago-data-config lago-rails lago-front
            lago-events-processor-worker lago-data-api lago-data-worker
            lago-data-forecasted-usage lago-mcp-server lago-pdf
            lago-data lago lago-staging
          )
          VERSION="${{ inputs.version }}"

          gh release view "v$VERSION" --json body -q .body > /tmp/release-notes.md

          cat >> /tmp/release-notes.md <<EOF

## OCI Packages

\`\`\`bash
helm pull oci://ghcr.io/getlago/helm-charts/lago --version $VERSION
\`\`\`

| Chart | OCI | GHCR |
|-------|-----|------|
EOF

          for chart in "${CHARTS[@]}"; do
            echo "| $chart | \`oci://ghcr.io/getlago/helm-charts/$chart:$VERSION\` | [Package](${GHCR_URL}${chart}) |" >> /tmp/release-notes.md
          done

          gh release edit "v$VERSION" --notes-file /tmp/release-notes.md

      - name: Package charts for GitHub release
        run: |
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            chart_name=$(basename "$chart")
            echo "::group::Packaging $chart_name"
            helm package "$chart" --destination .cr-release-packages
            echo "::endgroup::"
          done
          ls -lh .cr-release-packages/

      - name: Upload chart tarballs to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ inputs.version }}" .cr-release-packages/*.tgz --clobber

      - name: Update Helm repo index on gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages

          helm repo index .cr-release-packages \
            --url "https://github.com/getlago/lago-helm-charts/releases/download/v${{ inputs.version }}" \
            --merge /tmp/gh-pages/index.yaml

          mv .cr-release-packages/index.yaml /tmp/gh-pages/index.yaml
          rm -rf .cr-release-packages

          cd /tmp/gh-pages
          git add index.yaml
          git commit -m "Update Helm repo index for v${{ inputs.version }}"
          git push origin gh-pages
          cd -
          git worktree remove /tmp/gh-pages
