# Common tests for Deployment charts - validates extraEnv, extraEnvFrom, resources
# This file is copied to each chart's tests/ directory by the Taskfile
# Required: each chart must have tests/fixtures/required.yaml with chart-specific values
suite: Test common deployment patterns
templates:
  - templates/deployment.yaml
values:
  - ../values.yaml

tests:
  # ============================================================================
  # extraEnv Tests
  # ============================================================================
  - it: should include extraEnv variables in container env
    values:
      - ./fixtures/required.yaml
    set:
      extraEnv:
        - name: TEST_EXTRA_ENV_VAR
          value: "test-value-123"
        - name: TEST_EXTRA_ENV_FROM_FIELD
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TEST_EXTRA_ENV_FROM_SECRET
          valueFrom:
            secretKeyRef:
              name: test-secret
              key: test-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEST_EXTRA_ENV_VAR
            value: "test-value-123"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEST_EXTRA_ENV_FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEST_EXTRA_ENV_FROM_SECRET
            valueFrom:
              secretKeyRef:
                name: test-secret
                key: test-key

  # ============================================================================
  # extraEnvFrom Tests
  # ============================================================================
  - it: should include extraEnvFrom references in container envFrom
    values:
      - ./fixtures/required.yaml
    set:
      extraEnvFrom:
        - configMapRef:
            name: test-config-map
        - secretRef:
            name: test-secret-ref
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: test-config-map
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: test-secret-ref

  # ============================================================================
  # Resources Tests
  # ============================================================================
  - it: should include resources when specified
    values:
      - ./fixtures/required.yaml
    set:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: should not include resources when empty
    values:
      - ./fixtures/required.yaml
    set:
      resources: {}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  # ============================================================================
  # Combined Test - All Common Patterns
  # ============================================================================
  - it: should correctly render all common patterns together
    values:
      - ./fixtures/required.yaml
    set:
      extraEnv:
        - name: TEST_COMBINED_VAR
          value: "combined-test"
      extraEnvFrom:
        - configMapRef:
            name: test-combined-configmap
      resources:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 512Mi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEST_COMBINED_VAR
            value: "combined-test"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: test-combined-configmap
      - isNotNull:
          path: spec.template.spec.containers[0].resources
