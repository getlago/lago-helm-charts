version: 3

vars:
  VERSION: v1.32.4
  REGISTRY: oci://ghcr.io/getlago/helm-charts
  IMAGES:
    map:
      postgres: postgres:15-alpine
      redis: redis:7-alpine
      api: getlago/api:{{.VERSION}}
      front: getlago/front:{{.VERSION}}
      gotenberg: getlago/lago-gotenberg:8.15
  CHARTS:
    # Base configs (no dependencies)
    - lago-config
    - lago-data-config
    # Components depending on configs
    - lago-rails
    - lago-front
    - lago-events-processor-worker
    - lago-data-api
    - lago-data-worker
    - lago-data-forecasted-usage
    - lago-mcp-server
    # Umbrella charts (depend on components)
    - lago-data
    - lago
    # Top-level (depends on umbrella charts)
    - lago-staging

tasks:
  dependencies:update:
    desc: Update all chart dependencies (removes stale Chart.lock files first)
    cmds:
      - for:
          var: CHARTS
        cmd: rm -f charts/{{.ITEM}}/Chart.lock
      - for:
          var: CHARTS
        cmd: helm dependency update charts/{{.ITEM}}

  dependencies:build:
    desc: Build all chart dependencies
    deps: [dependencies:update]
    cmd:
      for:
        var: CHARTS
      cmd: helm dependency build charts/{{.ITEM}}

  lint:
    desc: Lint the chart
    preconditions:
      - sh: command -v ct
        msg: "❌ chart-testing not found (see: https://github.com/helm/chart-testing)"
    cmd: ct lint --config ct.yaml

  # https://github.com/kubernetes-sigs/kind/issues/3795
  kind:images:apple_silicon:*_*:
    internal: true
    cmds:
      - cmd: docker save --platform linux/arm64 -o {{index .MATCH 0}}.tar {{index .MATCH 1}}
      - defer: rm -f {{index .MATCH 0}}.tar
        silent: true
      - cmd: kind load --name lago image-archive {{index .MATCH 0}}.tar

  kind:images:*_*:
    vars:
      NAME: "{{index .MATCH 0}}"
      IMAGE: "{{index .MATCH 1}}"
    internal: true
    cmds:
      - docker images -q {{.IMAGE}} | grep -qv "." || docker pull {{.IMAGE}}
      - cmd: kind load --name lago docker-image {{.IMAGE}}
        platforms: [linux, windows, darwin/amd64]
      - task: kind:images:apple_silicon:{{.NAME}}_{{.IMAGE}}
        platforms: [darwin/arm64]

  kind:images:
    desc: Pull the images for the kind cluster
    cmds:
      - for: {var : IMAGES }
        task: kind:images:{{.KEY}}_{{.ITEM}}
    status:
      - test -n "{{ .NO_LOAD }}"

  kind:up:
    desc: Create a kind cluster
    preconditions:
      - sh: command -v kind
        msg: "❌ kind not found"
    cmds:
      - kind create cluster --name lago
      - task: kind:images
        vars:
          NO_LOAD: '{{ if not .LOAD }}true{{ end }}'
    status:
      - kind get clusters | grep -q "lago"


  kind:down:
    desc: Delete the kind cluster
    cmd: kind delete cluster --name lago

  test:unit:
    desc: Run unit tests for the charts
    preconditions:
      - sh: helm unittest -h
        msg: "❌ helm unittest not found (see: https://github.com/helm-unittest/helm-unittest)"
    cmds:
      - helm unittest ./charts/lago
      - helm unittest ./charts/lago-app

  test:e2e:
    desc: Create a kind cluster and deploy the chart
    preconditions:
      - sh: command -v kubectl
        msg: "❌ kubectl not found"
      - sh: command -v ct
        msg: "❌ chart-testing not found (see: https://github.com/helm/chart-testing)"
    cmds:
      - task: kind:up
      - kubectl apply -f charts/lago/ci/postgres.yml
      - kubectl apply -f charts/lago/ci/redis.yml
      - ct install --config ct.yaml --namespace default

  render:
    cmd: >
      helm template lago ./charts/lago
      --set apiUrl=http://localhost:3000
      --set frontUrl=http://localhost:3000
      --set global.databaseUrl=postgres://postgres:postgres@localhost:5432/postgres
      --set global.redisUrl=redis://localhost:6379
      {{join " " .CLI_ARGS_LIST}}

  render:clickhouse:
    cmds:
      - task: render
        vars:
          CLI_ARGS_LIST: >
            --set global.clickhouse.enabled=true {{.CLI_ARGS}}
            --set global.clickhouse.kafka.bootstrapServers[0]=kafka-server:9092

  # OCI Registry Tasks
  oci:login:
    desc: Login to GHCR using gh cli
    preconditions:
      - sh: command -v gh
        msg: "❌ gh cli not found (see: https://cli.github.com/)"
      - sh: gh auth status
        msg: "❌ gh cli not authenticated (run: gh auth login)"
    cmds:
      - gh auth refresh --hostname github.com --scopes write:packages
      - gh auth token | helm registry login ghcr.io -u $ --password-stdin

  oci:package:*:
    vars:
      CHART: '{{index .MATCH 0}}'
    preconditions:
      - sh: '[ -d "charts/{{.CHART}}" ]'
        msg: "❌ Chart directory charts/{{.CHART}} does not exist"
    cmds:
      - mkdir -p .helm-packages .helm-build
      - rm -rf .helm-build/{{.CHART}}
      - cp -r charts/{{.CHART}} .helm-build/
      # Transform file:// dependencies to OCI registry
      - 'sed -i.bak ''s|repository:.*"file://\.\.\/[^"]*"|repository: "{{.REGISTRY}}"|g'' .helm-build/{{.CHART}}/Chart.yaml'
      - rm -f .helm-build/{{.CHART}}/Chart.yaml.bak .helm-build/{{.CHART}}/Chart.lock
      - helm dependency update .helm-build/{{.CHART}}
      - helm package .helm-build/{{.CHART}} --destination .helm-packages

  oci:push:*:
    vars:
      CHART: '{{index .MATCH 0}}'
      CHART_VERSION:
        sh: grep '^version:' charts/{{index .MATCH 0}}/Chart.yaml | awk '{print $2}'
    preconditions:
      - sh: '[ -d "charts/{{.CHART}}" ]'
        msg: "❌ Chart directory charts/{{.CHART}} does not exist"
    cmds:
      - task: oci:package:{{.CHART}}
      - helm push .helm-packages/{{.CHART}}-{{.CHART_VERSION}}.tgz {{.REGISTRY}}
      - rm -f .helm-packages/{{.CHART}}-{{.CHART_VERSION}}.tgz
      - rm -rf .helm-build/{{.CHART}}

  oci:push:all:
    desc: Package and push all charts to GHCR
    cmds:
      - mkdir -p .helm-packages .helm-build
      - for:
          var: CHARTS
        task: oci:push:{{.ITEM}}
      - rm -rf .helm-packages .helm-build
